inn von „∼<i>p<\/i>“ <em class=\"sp\">kann nicht<\/em> verstanden werden, ohne dass vorher der Sinn von „<i>p<\/i>“ verstanden worden wäre. (Im Namen Julius Cäsar ist „Julius“ ein Index. Der Index ist immer ein Teil einer Beschreibung des Gegenstandes, dessen Namen wir ihn anhängen. Z. B. <em class=\"sp\">Der<\/em> Cäsar aus dem Geschlechte der Julier.) <\/p><p>Die Verwechslung von Argument und Index liegt, wenn ich mich nicht irre, der Theorie Frege’s von der Bedeutung der Sätze und Funktionen zugrunde. Für Frege waren die Sätze der Logik Namen, und deren Argumente die Indices dieser Namen. <\/p>"}, {"n": "5.1", "h": "<p> Die Wahrheitsfunktionen lassen sich in Reihen ordnen. Das ist die Grundlage der Wahrscheinlichkeitslehre. <\/p>"}, {"n": "5.101", "h": "<p> Die Wahrheitsfunktionen jeder Anzahl von Elementarsätzen lassen sich in einem Schema folgender Art hinschreiben: <\/p><table> <tbody><tr> <td>(WWWW)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>Tautologie <\/td> <td>(Wenn <i>p<\/i>, so <i>p<\/i>; und wenn <i>q<\/i>, so <i>q<\/i>.) (<i>p<\/i> ⊃ <i>p . q<\/i> ⊃ <i>q<\/i>) <\/td><\/tr> <tr> <td>(FWWW)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>in Worten: <\/td> <td>Nicht beides <i>p<\/i> und <i>q<\/i>. (∼(<i>p<\/i> . <i>q<\/i>)) <\/td><\/tr> <tr> <td>(WFWW)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td>Wenn <i>q<\/i>, so <i>p<\/i>. (q ⊃ p) <\/td><\/tr> <tr> <td>(WWFW)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td>Wenn <i>p<\/i>, so <i>q<\/i>. (p ⊃ q) <\/td><\/tr> <tr> <td>(WWWF)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td><i>p<\/i> oder <i>q<\/i>. (<i>p<\/i> ∨ <i>q<\/i>) <\/td><\/tr> <tr> <td>(FFWW)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td>Nicht <i>q<\/i>. ∼<i>q<\/i> <\/td><\/tr> <tr> <td>(FWFW)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td>Nicht <i>p<\/i>. ∼<i>p<\/i> <\/td><\/tr> <tr> <td>(FWWF)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td><i>p<\/i> oder <i>q<\/i>, aber nicht beide. (<i>p<\/i> . ∼<i>q<\/i>&nbsp;: ∨&nbsp;: <i>q<\/i> . ∼<i>p<\/i>) <\/td><\/tr> <tr> <td>(WFFW)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td>Wenn <i>p<\/i>, so <i>q<\/i>; und wenn <i>q<\/i>, so <i>p<\/i>. (<i>p<\/i> ≡ <i>q<\/i>) <\/td><\/tr> <tr> <td>(WFWF)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td><i>p<\/i> <\/td><\/tr> <tr> <td>(WWFF)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td><i>q<\/i> <\/td><\/tr> <tr> <td>(FFFW)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td>Weder <i>p<\/i> noch <i>q<\/i>. (∼<i>p<\/i> . ∼<i>q<\/i>) oder (<i>p<\/i> | <i>q<\/i>) <\/td><\/tr> <tr> <td>(FFWF)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td><i>p<\/i> und nicht <i>q<\/i>. (<i>p<\/i> . ∼<i>q<\/i>) <\/td><\/tr> <tr> <td>(FWFF)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td><i>q<\/i> und nicht <i>p<\/i>. (<i>q<\/i> . ∼<i>p<\/i>) <\/td><\/tr> <tr> <td>(WFFF)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>„ „ <\/td> <td><i>q<\/i> und <i>p<\/i>. (<i>q<\/i> . <i>p<\/i>) <\/td><\/tr> <tr> <td>(FFFF)(<i>p<\/i>, <i>q<\/i>) <\/td> <td>Kontradiktion <\/td> <td>(<i>p<\/i> und nicht <i>p<\/i>; und <i>q<\/i> und nicht <i>q<\/i>.) (<i>p<\/i> . ∼<i>p<\/i> . <i>q<\/i> . ∼<i>q<\/i>) <\/td><\/tr><\/tbody><\/table><p>Diejenigen Wahrheitsmöglichkeiten seiner Wahrheitsargumente, welche den Satz bewahrheiten, will ich seine <em class=\"sp\">Wahrheitsgründe<\/em> nennen. <\/p>"}, {"n": "5.11", "h": "<p> Sind die Wahrheitsgründe, die einer Anzahl von Sätzen gemeinsam sind, sämtlich auch Wahrheitsgründe eines bestimmten Satzes, so sagen wir, die Wahrheit dieses Satzes folge aus der Wahrheit jener Sätze. <\/p>"}, {"n": "5.12", "h": "<p> Insbesondere folgt die Wahrheit eines Satzes „<i>p<\/i>“ aus der Wahrheit eines anderen „<i>q<\/i>“, wenn alle Wahrheitsgründe des zweiten Wahrheitsgründe des ersten sind. <\/p>"}, {"n": "5.121", "h": "<p> Die Wahrheitsgründe des einen sind in denen des anderen enthalten; <i>p<\/i> folgt aus <i>q<\/i>. <\/p>"}, {"n": "5.122", "h": "<p> Folgt <i>p<\/i> aus <i>q<\/i>, so ist der Sinn von „<i>p<\/i>“ im Sinne von „<i>q<\/i>“ enthalten. <\/p>"}, {"n": "5.123", "h": "<p> Wenn ein Gott eine Welt erschafft, worin gewisse Sätze wahr sind, so schafft er damit auch schon eine Welt, in welcher alle ihre Folgesätze stimmen. Und ähnlich könnte er keine Welt schaffen, worin der Satz „<i>p<\/i>“ wahr ist, ohne seine sämtlichen Gegenstände zu schaffen. <\/p>"}, {"n": "5.124", "h": "<p> Der Satz bejaht jeden Satz der aus ihm folgt. <\/p>"}, {"n": "5.1241", "h": "<p> „<i>p . q<\/i>“ ist einer der Sätze, welche „<i>p<\/i>“ bejahen und zugleich einer der Sätze, welche „<i>q<\/i>“ bejahen. <\/p><p>Zwei Sätze sind einander entgegengesetzt, wenn es keinen sinnvollen Satz gibt, der sie beide bejaht. <\/p><p>Jeder Satz der einem anderen widerspricht, verneint ihn. <\/p>"}, {"n": "5.13", "h": "<p> Dass die Wahrheit eines Satzes aus der Wahrheit anderer Sätze folgt, ersehen wir aus der Struktur der Sätze. <\/p>"}, {"n": "5.131", "h": "<p> Folgt die Wahrheit eines Satzes aus der Wahrheit anderer, so drückt sich dies durch Beziehungen aus, in welchen die Formen jener Sätze zu einander stehen; und zwar brauchen wir sie nicht erst in jene Beziehungen zu setzen, indem wir sie in einem Satze miteinander verbinden, sondern diese Beziehungen sind intern und bestehen, sobald, und dadurch dass, jene Sätze bestehen. <\/p>"}, {"n": "5.1311", "h": "<p> Wenn wir von <i>p<\/i> ∨ <i>q<\/i> und ∼<i>p<\/i> auf <i>q<\/i> schliessen, so ist hier durch die Bezeichnungsweise die Beziehung der Satzformen von „<i>p<\/i> ∨ <i>q<\/i>“ und „∼<i>p<\/i>“ verhüllt. Schreiben wir aber z. B. statt „<i>p<\/i> ∨ <i>q<\/i>“ „<i>p<\/i> | <i>q<\/i> . | . <i>p<\/i> | <i>q<\/i>“ und statt „∼<i>p<\/i>“ „<i>p<\/i> | <i>p<\/i>“ (<i>p<\/i> | <i>q<\/i> = weder <i>p<\/i>, noch <i>q<\/i>), so wird der innere Zusammenhang offenbar. <\/p><p>(Dass man aus (<i>x<\/i>) <i>. fx<\/i> auf <i>fa<\/i> schliessen kann, das zeigt, dass die Allgemeinheit auch im Symbol „(<i>x<\/i>) . <i>fx<\/i>“ vorhanden ist.) <\/p>"}, {"n": "5.132", "h": "<p> Folgt <i>p<\/i> aus <i>q<\/i>, so kann ich von <i>q<\/i> auf <i>p<\/i> schliessen; <i>p<\/i> aus <i>q<\/i> folgern. <\/p><p>Die Art des Schlusses ist allein aus den beiden Sätzen zu entnehmen. <\/p><p>Nur sie selbst können den Schluss rechtfertigen. <\/p><p>„Schlussgesetze“, welche – wie bei Frege und Russell – die Schlüsse rechtfertigen sollen, sind sinnlos, und wären überflüssig. <\/p>"}, {"n": "5.133", "h": "<p> Alles Folgern geschieht a priori. <\/p>"}, {"n": "5.134", "h": "<p> Aus einem Elementarsatz lässt sich kein anderer folgern. <\/p>"}, {"n": "5.135", "h": "<p> Auf keine Weise kann aus dem Bestehen irgend einer Sachlage auf das Bestehen einer, von ihr gänzlich verschiedenen Sachlage geschlossen werden. <\/p>"}, {"n": "5.136", "h": "<p> Einen Kausalnexus, der einen solchen Schluss rechtfertigte, gibt es nicht. <\/p>"}, {"n": "5.1361", "h": "<p> Die Ereignisse der Zukunft <em class=\"sp\">können<\/em> wir nicht aus den gegenwärtigen erschliessen. <\/p><p>Der Glaube an den Kausalnexus ist der <em class=\"sp\">Aberglaube<\/em>. <\/p>"}, {"n": "5.1362", "h": "<p> Die Willensfreiheit besteht darin, dass zukünftige Handlungen jetzt nicht gewusst werden können. Nur dann könnten wir sie wissen, wenn die Kausalität eine <em class=\"sp\">innere<\/em> Notwendigkeit wäre, wie die des logischen Schlusses. – Der Zusammenhang von Wissen und Gewusstem, ist der der logischen Notwendigkeit. <\/p><p>(„A weiss, dass <i>p<\/i> der Fall ist“ ist sinnlos, wenn <i>p<\/i> eine Tautologie ist.) <\/p>"}, {"n": "5.1363", "h": "<p> Wenn daraus, dass ein Satz uns einleuchtet, nicht <em class=\"sp\">folgt<\/em>, dass er wahr ist, so ist das Einleuchten auch keine Rechtfertigung für unseren Glauben an seine Wahrheit. <\/p>"}, {"n": "5.14", "h": "<p> Folgt ein Satz aus einem anderen, so sagt dieser mehr als jener, jener weniger als dieser. <\/p>"}, {"n": "5.141", "h": "<p> Folgt <i>p<\/i> aus <i>q<\/i> und <i>q<\/i> aus <i>p<\/i>, so sind sie ein und derselbe Satz. <\/p>"}, {"n": "5.142", "h": "<p> Die Tautologie folgt aus allen Sätzen: sie sagt Nichts. <\/p>"}, {"n": "5.143", "h": "<p> Die Kontradiktion ist das Gemeinsame der Sätze, was <em class=\"sp\">kein<\/em> Satz mit einem anderen gemein hat. Die Tautologie ist das Gemeinsame aller Sätze, welche nichts miteinander gemein haben. <\/p><p>Die Kontradiktion verschwindet sozusagen ausserhalb, die Tautologie innerhalb aller Sätze. <\/p><p>Die Kontradiktion ist die äussere Grenze der Sätze, die Tautologie ihr substanzloser Mittelpunkt. <\/p>"}, {"n": "5.15", "h": "<p> Ist <i>W<sub>r<\/sub><\/i> die Anzahl der Wahrheitsgründe des Satzes „<i>r<\/i>“, <i>W<sub>rs<\/sub><\/i> die Anzahl derjenigen Wahrheitsgründe des Satzes „<i>s<\/i>“, die zugleich Wahrheitsgründe von „<i>r<\/i>“ sind, dann nennen wir das Verhältnis: <i>W<sub>rs<\/sub><\/i>&nbsp;: <i>W<sub>r<\/sub><\/i> das Mass der <em class=\"sp\">Wahrscheinlichkeit<\/em>, welche der Satz „<i>r<\/i>“ dem Satz „<i>s<\/i>“ gibt. <\/p>"}, {"n": "5.151", "h": "<p> Sei in einem Schema wie dem obigen in No. 5.101 <i>W<sub>r<\/sub><\/i> die Anzahl der „<i>W<\/i> “ im Satze <i>r<\/i>; <i>W<sub>rs<\/sub><\/i> die Anzahl derjenigen „<i>W<\/i> “ im Satze <i>s<\/i>, die in gleichen Kolonnen mit „<i>W<\/i> “ des Satzes <i>r<\/i> stehen. Der Satz <i>r<\/i> gibt dann dem Satze <i>s<\/i> die Wahrscheinlichkeit: <i>W<sub>rs<\/sub><\/i>&nbsp;: <i>W<sub>r<\/sub><\/i>. <\/p>"}, {"n": "5.1511", "h": "<p> Es gibt keinen besonderen Gegenstand, der den Wahrscheinlichkeitssätzen eigen wäre. <\/p>"}, {"n": "5.152", "h": "<p> Sätze, welche keine Wahrheitsargumente mit einander gemein haben, nennen wir von einander unabhängig. <\/p><p>Von einander unabhängige Sätze (z. B. irgend zwei Elementarsätze) geben einander die Wahrscheinlichkeit ½. <\/p><p>Folgt <i>p<\/i> aus <i>q<\/i>, so gibt der Satz „<i>q<\/i>“ dem Satz „<i>p<\/i>“ die Wahrscheinlichkeit 1. Die Gewissheit des logischen Schlusses ist ein Grenzfall der Wahrscheinlichkeit. <\/p><p>(Anwendung auf Tautologie und Kontradiktion.) <\/p>"}, {"n": "5.153", "h": "<p> Ein Satz ist an sich weder wahrscheinlich noch unwahrscheinlich. Ein Ereignis trifft ein, oder es trifft nicht ein, ein Mittelding gibt es nicht. <\/p>"}, {"n": "5.154", "h": "<p> In einer Urne seien gleichviel weisse und schwarze Kugeln (und keine anderen). Ich ziehe eine Kugel nach der anderen und lege sie wieder in die Urne zurück. Dann kann ich durch den Versuch feststellen, dass sich die Zahlen der gezogenen schwarzen und weissen Kugeln bei fortgesetztem Ziehen einander nähern. <\/p><p><em class=\"sp\">Das<\/em> ist also kein mathematisches Faktum. <\/p><p>Wenn ich nun sage: Es ist gleich wahrscheinlich, dass ich eine weisse Kugel wie eine schwarze ziehen werde, so heisst das: Alle mir bekannten Umstände (die hypothetisch angenommenen Naturgesetze mitinbegriffen) geben dem Eintreffen des einen Ereignisses nicht <em class=\"sp\">mehr<\/em> Wahrscheinlichkeit als dem Eintreffen des anderen. Das heisst, sie geben – wie aus den obigen Erklärungen leicht zu entnehmen ist – jedem die Wahrscheinlichkeit ½. <\/p><p>Was ich durch den Versuch bestätige ist, dass das Eintreffen der beiden Ereignisse von den Umständen, die ich nicht näher kenne, unabhängig ist. <\/p>"}, {"n": "5.155", "h": "<p> Die Einheit des Wahrscheinlichkeitssatzes ist: Die Umstände – die ich sonst nicht weiter kenne – geben dem Eintreffen eines bestimmten Ereignisses den und den Grad der Wahrscheinlichkeit. <\/p>"}, {"n": "5.156", "h": "<p> So ist die Wahrscheinlichkeit eine Verallgemeinerung. <\/p><p>Sie involviert eine allgemeine Beschreibung einer Satzform. <\/p><p>Nur in Ermanglung der Gewissheit gebrauchen wir die Wahrscheinlichkeit. – Wenn wir zwar eine Tatsache nicht vollkommen kennen, wohl aber <em class=\"sp\">etwas<\/em> über ihre Form wissen. <\/p><p>(Ein Satz kann zwar ein unvollständiges Bild einer gewissen Sachlage sein, aber er ist immer <em class=\"sp\">ein<\/em> vollständiges Bild.) <\/p><p>Der Wahrscheinlichkeitssatz ist gleichsam ein Auszug aus anderen Sätzen. <\/p>"}, {"n": "5.2", "h": "<p> Die Strukturen der Sätze stehen in internen Beziehungen zu einander. <\/p>"}, {"n": "5.21", "h": "<p> Wir können diese internen Beziehungen dadurch in unserer Ausdrucksweise hervorheben, dass wir einen Satz als Resultat einer Operation darstellen, die ihn aus anderen Sätzen (den Basen der Operation) hervorbringt. <\/p>"}, {"n": "5.22", "h": "<p> Die Operation ist der Ausdruck einer Beziehung zwischen den Strukturen ihres Resultats und ihrer Basen. <\/p>"}, {"n": "5.23", "h": "<p> Die Operation ist das, was mit dem einen Satz geschehen muss, um aus ihm den anderen zu machen. <\/p>"}, {"n": "5.231", "h": "<p> Und das wird natürlich von ihren formalen Eigenschaften, von der internen Ähnlichkeit ihrer Formen abhängen. <\/p>"}, {"n": "5.232", "h": "<p> Die interne Relation, die eine Reihe ordnet, ist äquivalent mit der Operation, durch welche ein Glied aus dem anderen entsteht. <\/p>"}, {"n": "5.233", "h": "<p> Die Operation kann erst dort auftreten, wo ein Satz auf logisch bedeutungsvolle Weise aus einem anderen entsteht. Also dort, wo die logische Konstruktion des Satzes anfängt. <\/p>"}, {"n": "5.234", "h": "<p> Die Wahrheitsfunktionen der Elementarsätze sind Resultate von Operationen, die die Elementarsätze als Basen haben. (Ich nenne diese Operationen Wahrheitsoperationen.) <\/p>"}, {"n": "5.2341", "h": "<p> Der Sinn einer Wahrheitsfunktion von <i>p<\/i> ist eine Funktion des Sinnes von <i>p<\/i>. <\/p><p>Verneinung, logische Addition, logische Multiplikation, etc., etc. sind Operationen. <\/p><p>(Die Verneinung verkehrt den Sinn des Satzes.) <\/p>"}, {"n": "5.24", "h": "<p> Die Operation zeigt sich in einer Variablen; sie zeigt, wie man von einer Form von Sätzen zu einer anderen gelangen kann. <\/p><p>Sie bringt den Unterschied der Formen zum Ausdruck. (Und das Gemeinsame zwischen den Basen und dem Resultat der Operation sind eben die Basen.) <\/p>"}, {"n": "5.241", "h": "<p> Die Operation kennzeichnet keine Form, sondern nur den Unterschied der Formen. <\/p>"}, {"n": "5.242", "h": "<p> Dieselbe Operation, die „<i>q<\/i>“ aus „<i>p<\/i>“ macht, macht aus „<i>q<\/i>“ „<i>r<\/i>“ u. s. f. Dies kann nur darin ausgedrückt sein, dass „<i>p<\/i>“, „<i>q<\/i>“, „<i>r<\/i>“, etc. Variable sind, die gewisse formale Relationen allgemein zum Ausdruck bringen. <\/p>"}, {"n": "5.25", "h": "<p> Das Vorkommen der Operation charakterisiert den Sinn des Satzes nicht. <\/p><p>Die Operation sagt ja nichts aus, nur ihr Resultat, und dies hängt von den Basen der Operation ab. <\/p><p>(Operation und Funktion dürfen nicht miteinander verwechselt werden.) <\/p>"}, {"n": "5.251", "h": "<p> Eine Funktion kann nicht ihr eigenes Argument sein, wohl aber kann das Resultat einer Operation ihre eigene Basis werden. <\/p>"}, {"n": "5.252", "h": "<p> Nur so ist das Fortschreiten von Glied zu Glied in einer Formenreihe (von Type zu Type in den Hierarchien Russells und Whiteheads) möglich. (Russell und Whitehead haben die Möglichkeit dieses Fortschreitens nicht zugegeben, aber immer wieder von ihr Gebrauch gemacht.) <\/p>"}, {"n": "5.2521", "h": "<p> Die fortgesetzte Anwendung einer Operation auf ihr eigenes Resultat nenne ich ihre successive Anwendung („<i>O'O'O'a<\/i>“ ist das Resultat der dreimaligen successiven Anwendung von „<i>O'ξ<\/i>“ auf „<i>a<\/i>“). <\/p><p>In einem ähnlichen Sinne rede ich von der successiven Anwendung <em class=\"sp\">mehrerer<\/em> Operationen auf eine Anzahl von Sätzen. <\/p>"}, {"n": "5.2522", "h": "<p> Das allgemeine Glied einer Formenreihe <i>a<\/i>, <i>O'a<\/i>, <i>O'O'a<\/i>, <i>. . . .<\/i> schreibe ich daher so: „[<i>a, x, O'x<\/i>]“. Dieser Klammerausdruck ist eine Variable. Das erste Glied des Klammerausdruckes ist der Anfang der Formenreihe, das zweite die Form eines beliebigen Gliedes <i>x<\/i> der Reihe und das dritte die Form desjenigen Gliedes der Reihe, welches auf <i>x<\/i> unmittelbar folgt. <\/p>"}, {"n": "5.2523", "h": "<p> Der Begriff der successiven Anwendung der Operation ist äquivalent mit dem Begriff „und so weiter“. <\/p>"}, {"n": "5.253", "h": "<p> Eine Operation kann die Wirkung einer anderen rückgängig machen. Operationen können einander aufheben. <\/p>"}, {"n": "5.254", "h": "<p> Die Operation kann verschwinden (z. B. die Verneinung in „∼∼<i>p<\/i>“, ∼∼<i>p<\/i> = <i>p<\/i>). <\/p>"}, {"n": "5.3", "h": "<p> Alle Sätze sind Resultate von Wahrheitsoperationen mit den Elementarsätzen. <\/p><p>Die Wahrheitsoperation ist die Art und Weise, wie aus den Elementarsätzen die Wahrheitsfunktion entsteht. <\/p><p>Nach dem Wesen der Wahrheitsoperation wird auf die gleiche Weise, wie aus den Elementarsätzen ihre Wahrheitsfunktion, aus Wahrheitsfunktionen eine Neue. Jede Wahrheitsoperation erzeugt aus Wahrheitsfunktionen von Elementarsätzen wieder eine Wahrheitsfunktion von Elementarsätzen, einen Satz. Das Resultat jeder Wahrheitsoperation mit den Resultaten von Wahrheitsoperationen mit Elementarsätzen ist wieder das Resultat <em class=\"sp\">Einer<\/em> Wahrheitsoperation mit Elementarsätzen. <\/p><p>Jeder Satz ist das Resultat von Wahrheitsoperationen mit Elementarsätzen. <\/p>"}, {"n": "5.31", "h": "<p> Die Schemata No. 4.31 haben auch dann eine Bedeutung, wenn „<i>p<\/i>“, „<i>q<\/i>“, „<i>r<\/i>“, etc. nicht Elementarsätze sind. <\/p><p>Und es ist leicht zu sehen, dass das Satzzeichen in No. 4.442, auch wenn „<i>p<\/i>“ und „<i>q<\/i>“ Wahrheitsfunktionen von Elementarsätzen sind, Eine Wahrheitsfunktion von Elementarsätzen ausdrückt. <\/p>"}, {"n": "5.32", "h": "<p> Alle Wahrheitsfunktionen sind Resultate der successiven Anwendung einer endlichen Anzahl von Wahrheitsoperationen auf die Elementarsätze. <\/p>"}, {"n": "5.4", "h": "<p> Hier zeigt es sich, dass es „logische Gegenstände“, „logische Konstante“ (im Sinne Freges und Russells) nicht gibt. <\/p>"}, {"n": "5.41", "h": "<p> Denn: Alle Resultate von Wahrheitsoperationen mit Wahrheitsfunktionen sind identisch, welche eine und dieselbe Wahrheitsfunktion von Elementarsätzen sind. <\/p>"}, {"n": "5.42", "h": "<p> Dass ∨, ⊃, etc. nicht Beziehungen im Sinne von rechts und links etc. sind, leuchtet ein. <\/p><p>Die Möglichkeit des kreuzweisen Definierens der logischen „Urzeichen“ Freges und Russells zeigt schon, dass dies keine Urzeichen sind, und schon erst recht, dass sie keine Relationen bezeichnen. <\/p><p>Und es ist offenbar, dass das „⊃“, welches wir durch „∼“ und „∨“ definieren, identisch ist mit dem, durch welches wir „∨ “ mit „∼“ definieren und dass dieses „∨“ mit dem ersten identisch ist. U. s. w. <\/p>"}, {"n": "5.43", "h": "<p> Dass aus einer Tatsache <i>p<\/i> unendlich viele <em class=\"sp\">andere<\/em> folgen sollten, nämlich ∼∼<i>p<\/i>, ∼∼∼∼<i>p<\/i>, etc., ist doch von vornherein kaum zu glauben. Und nicht weniger merkwürdig ist, dass die unendliche Anzahl der Sätze der Logik (der Mathematik) aus einem halben Dutzend „Grundgesetzen“ folgen. <\/p><p>Alle Sätze der Logik sagen aber dasselbe. Nämlich Nichts. <\/p>"}, {"n": "5.44", "h": "<p> Die Wahrheitsfunktionen sind keine materiellen Funktionen. <\/p><p>Wenn man z. B. eine Bejahung durch doppelte Verneinung erzeugen kann, ist dann die Verneinung – in irgend einem Sinn – in der Bejahung enthalten? Verneint „∼∼<i>p<\/i>“ ∼<i>p<\/i>, oder bejaht es <i>p<\/i>; oder beides? <\/p><p>Der Satz „∼∼<i>p<\/i>“ handelt nicht von der Verneinung wie von einem Gegenstand; wohl aber ist die Möglichkeit der Verneinung in der Bejahung bereits präjudiziert. <\/p><p>Und gäbe es einen Gegenstand, der „∼“ hiesse, so müsste „∼∼<i>p<\/i>“ etwas anderes sagen als „<i>p<\/i>“. Denn der eine Satz würde dann eben von ∼ handeln, der andere nicht. <\/p>"}, {"n": "5.441", "h": "<p> Dieses Verschwinden der scheinbaren logischen Konstanten tritt auch ein, wenn „∼(∃<i>x<\/i>) <i>.<\/i> ∼<i>fx<\/i>“ dasselbe sagt wie „(<i>x<\/i>) <i>. fx<\/i>“, oder „(∃<i>x<\/i>) <i>. fx . x<\/i> = <i>a<\/i>“ dasselbe wie „<i>fa<\/i>“. <\/p>"}, {"n": "5.442", "h": "<p> Wenn uns ein Satz gegeben ist, so sind <em class=\"sp\">mit ihm<\/em> auch schon die Resultate aller Wahrheitsoperationen, die ihn zur Basis haben, gegeben. <\/p>"}, {"n": "5.45", "h": "<p> Gibt es logische Urzeichen, so muss eine richtige Logik ihre Stellung zueinander klar machen und ihr Dasein rechtfertigen. Der Bau der Logik <em class=\"sp\">aus<\/em> ihren Urzeichen muss klar werden. <\/p>"}, {"n": "5.451", "h": "<p> Hat die Logik Grundbegriffe, so müssen sie von einander unabhängig sein. Ist ein Grundbegriff eingeführt, so muss er in allen Verbindungen eingeführt sein, worin er überhaupt vorkommt. Man kann ihn also nicht zuerst für <em class=\"sp\">eine<\/em> Verbindung, dann noch einmal für eine andere einführen. Z. B.: Ist die Verneinung eingeführt, so müssen wir sie jetzt in Sätzen von der Form „∼<i>p<\/i>“ ebenso verstehen, wie in Sätzen wie „∼(<i>p<\/i> ∨ <i>q<\/i>)“, „(∃<i>x<\/i>) <i>.<\/i> ∼<i>fx<\/i>“ u. a. Wir dürfen sie nicht erst für die eine Klasse von Fällen, dann für die andere einführen, denn es bliebe dann zweifelhaft, ob ihre Bedeutung in beiden Fällen die gleiche wäre und es wäre kein Grund vorhanden, in beiden Fällen dieselbe Art der Zeichenverbindung zu benützen. <\/p><p>(Kurz, für die Einführung der Urzeichen gilt, mutatis mutandis, dasselbe, was Frege („Grundgesetze der Arithmetik“) für die Einführung von Zeichen durch Definitionen gesagt hat.) <\/p>"}, {"n": "5.452", "h": "<p> Die Einführung eines neuen Behelfes in den Symbolismus der Logik muss immer ein folgenschweres Ereignis sein. Kein neuer Behelf darf in die Logik – sozusagen, mit ganz unschuldiger Miene – in Klammern oder unter dem Striche eingeführt werden. <\/p><p>(So kommen in den „Principia Mathematica“ von Russell und Whitehead Definitionen und Grundgesetze in Worten vor. Warum hier plötzlich Worte? Dies bedürfte einer Rechtfertigung. Sie fehlt und muss fehlen, da das Vorgehen tatsächlich unerlaubt ist.) <\/p><p>Hat sich aber die Einführung eines neuen Behelfes an einer Stelle als nötig erwiesen, so muss man sich nun sofort fragen: Wo muss dieser Behelf nun <em class=\"sp\">immer<\/em> angewandt werden? Seine Stellung in der Logik muss nun erklärt werden. <\/p>"}, {"n": "5.453", "h": "<p> Alle Zahlen der Logik müssen sich rechtfertigen lassen. <\/p><p>Oder vielmehr: Es muss sich herausstellen, dass es in der Logik keine Zahlen gibt. <\/p><p>Es gibt keine ausgezeichneten Zahlen. <\/p>"}, {"n": "5.454", "h": "<p> In der Logik gibt es kein Nebeneinander, kann es keine Klassifikation geben. <\/p><p>In der Logik kann es nicht Allgemeineres und Spezielleres geben. <\/p>"}, {"n": "5.4541", "h": "<p> Die Lösungen der logischen Probleme müssen einfach sein, denn sie setzen den Standard der Einfachheit. <\/p><p>Die Menschen haben immer geahnt, dass es ein Gebiet von Fragen geben müsse, deren Antworten – a priori – symmetrisch, und zu einem abgeschlossenen, regelmässigen Gebilde vereint liegen. <\/p><p>Ein Gebiet, in dem der Satz gilt: simplex sigillum veri. <\/p>"}, {"n": "5.46", "h": "<p> Wenn man die logischen Zeichen richtig einführte, so hätte man damit auch schon den Sinn aller ihrer Kombinationen eingeführt; also nicht nur „<i>p<\/i> ∨ <i>q<\/i>“ sondern auch schon „∼(<i>p<\/i> ∨ ∼<i>q<\/i>)“ etc. etc. Man hätte damit auch schon die Wirkung aller nur möglichen Kombinationen von Klammern eingeführt. Und damit wäre es klar geworden, dass die eigentlichen allgemeinen Urzeichen nicht die „<i>p<\/i> ∨ <i>q<\/i>“, „(∃<i>x<\/i>) <i>. fx<\/i>“, etc. sind, sondern die allgemeinste Form ihrer Kombinationen. <\/p>"}, {"n": "5.461", "h": "<p> Bedeutungsvoll ist die scheinbar unwichtige Tatsache, dass die logischen Scheinbeziehungen, wie ∨ und ⊃, der Klammern bedürfen – im Gegensatz zu den wirklichen Beziehungen. <\/p><p>Die Benützung der Klammern mit jenen scheinbaren Urzeichen deutet ja schon darauf hin, dass diese nicht die wirklichen Urzeichen sind. Und es wird doch wohl niemand glauben, dass die Klammern eine selbständige Bedeutung haben. <\/p>"}, {"n": "5.4611", "h": "<p> Die logischen Operationszeichen sind Interpunktionen. <\/p>"}, {"n": "5.47", "h": "<p> Es ist klar, dass alles was sich überhaupt <em class=\"sp\">von vornherein<\/em> über die Form aller Sätze sagen lässt, sich <em class=\"sp\">aufeinmal<\/em> sagen lassen muss. <\/p><p>Sind ja schon im Elementarsatze alle logischen Operationen enthalten. Denn „<i>fa<\/i>“ sagt dasselbe wie „(∃<i>x<\/i>) <i>. fx . x<\/i> = <i>a<\/i>“. <\/p><p>Wo Zusammengesetztheit ist, da ist Argument und Funktion, und wo diese sind, sind bereits alle logischen Konstanten. <\/p><p>Man könnte sagen: Die Eine logische Konstante ist das, was <em class=\"sp\">alle<\/em> Sätze, ihrer Natur nach, mit einander gemein haben. <\/p><p>Das aber ist die allgemeine Satzform. <\/p>"}, {"n": "5.471", "h": "<p> Die allgemeine Satzform ist das Wesen des Satzes. <\/p>"}, {"n": "5.4711", "h": "<p> Das Wesen des Satzes angeben, heisst, das Wesen aller Beschreibung angeben, also das Wesen der Welt. <\/p>"}, {"n": "5.472", "h": "<p> Die Beschreibung der allgemeinsten Satzform ist die Beschreibung des einen und einzigen allgemeinen Urzeichens der Logik. <\/p>"}, {"n": "5.473", "h": "<p> Die Logik muss für sich selber sorgen. <\/p><p>Ein <em class=\"sp\">mögliches<\/em> Zeichen muss auch bezeichnen können. Alles was in der Logik möglich ist, ist auch erlaubt. („Sokrates ist identisch“ heisst darum nichts, weil es keine Eigenschaft gibt, die „identisch“ heisst. Der Satz ist unsinnig, weil wir eine willkürliche Bestimmung nicht getroffen haben, aber nicht darum, weil das Symbol an und für sich unerlaubt wäre.) <\/p><p>Wir können uns, in gewissem Sinne, nicht in der Logik irren. <\/p>"}, {"n": "5.4731", "h": "<p> Das Einleuchten, von dem Russell so viel sprach, kann nur dadurch in der Logik entbehrlich werden, dass die Sprache selbst jeden logischen Fehler verhindert. – Dass die Logik a priori ist, besteht darin, dass nicht unlogisch gedacht werden <em class=\"sp\">kann<\/em>. <\/p>"}, {"n": "5.4732", "h": "<p> Wir können einem Zeichen nicht den unrechten Sinn geben. <\/p>"}, {"n": "5.47321", "h": "<p> Occams Devise ist natürlich keine willkürliche, oder durch ihren praktischen Erfolg gerechtfertigte, Regel: Sie besagt, dass <em class=\"sp\">unnötige<\/em> Zeicheneinheiten nichts bedeuten. <\/p><p>Zeichen, die <em class=\"sp\">Einen<\/em> Zweck erfüllen, sind logisch äquivalent, Zeichen, die <em class=\"sp\">keinen<\/em> Zweck erfüllen, logisch bedeutungslos. <\/p>"}, {"n": "5.4733", "h": "<p> Frege sagt: Jeder rechtmässig gebildete Satz muss einen Sinn haben; und ich sage: Jeder mögliche Satz ist rechtmässig gebildet, und wenn er keinen Sinn hat, so kann das nur daran liegen, dass wir einigen seiner Bestandteile keine <em class=\"sp\">Bedeutung<\/em> gegeben haben. <\/p><p>(Wenn wir auch glauben, es getan zu haben.) <\/p><p>So sagt „Sokrates ist identisch“ darum nichts, weil wir dem Wort „identisch“ als <em class=\"sp\">Eigenschaftswort keine<\/em> Bedeutung gegeben haben. Denn, wenn es als Gleichheitszeichen auftritt, so symbolisiert es auf ganz andere Art und Weise – die bezeichnende Beziehung ist eine andere, – also ist auch das Symbol in beiden Fällen ganz verschieden; die beiden Symbole haben nur das Zeichen zufällig miteinander gemein. <\/p>"}, {"n": "5.474", "h": "<p> Die Anzahl der nötigen Grundoperationen hängt nu r von unserer Notation ab. <\/p>"}, {"n": "5.475", "h": "<p> Es kommt nur darauf an, ein Zeichensystem von einer bestimmten Anzahl von Dimensionen – von einer bestimmten mathematischen Mannigfaltigkeit – zu bilden. <\/p>"}, {"n": "5.476", "h": "<p> Es ist klar, dass es sich hier nicht um eine <em class=\"sp\">Anzahl von Grundbegriffen<\/em> handelt, die bezeichnet werden müssen, sondern um den Ausdruck einer Regel. <\/p>"}, {"n": "5.5", "h": "<p> Jede Wahrheitsfunktion ist ein Resultat der successiven Anwendung der Operation (– – – – –W)(<i>ξ, . . . .<\/i>) auf Elementarsätze. <\/p><p>Diese Operation verneint sämtliche Sätze in der rechten Klammer und ich nenne sie die Negation dieser Sätze. <\/p>"}, {"n": "5.501", "h": "<p> Einen Klammerausdruck, dessen Glieder Sätze sind, deute ich – wenn die Reihenfolge der Glieder in der Klammer gleichgültig ist – durch ein Zeichen von der Form „<span>\\(\\displaystyle{ (\\bar{\\xi}) }\\)<\/span>“ an. „<i>ξ<\/i>“ ist eine Variable, deren Werte die Glieder des Klammerausdruckes sind; und der Strich über der Variablen deutet an, dass sie ihre sämtlichen Werte in der Klammer vertritt. <\/p><p>(Hat also <i>ξ<\/i> etwa die 3 Werte P, Q, R, so ist <span>\\(\\displaystyle{ (\\bar{\\xi}) }\\)<\/span> = (P, Q, R).) <\/p><p>Die Werte der Variablen werden festgesetzt. <\/p><p>Die Festsetzung ist die Beschreibung der Sätze, welche die Variable vertritt. <\/p><p>Wie die Beschreibung der Glieder des Klammerausdruckes geschieht, ist unwesentlich. <\/p><p>Wir <em class=\"sp\">können<\/em> drei Arten der Beschreibung unterscheiden: 1. Die direkte Aufzählung. In diesem Fall können wir statt der Variablen einfach ihre konstanten Werte setzen. 2. Die Angabe einer Funktion <i>fx<\/i>, deren Werte für alle Werte von <i>x<\/i> die zu beschreibenden Sätze sind. 3. Die Angabe eines formalen Gesetzes, nach welchem jene Sätze gebildet sind. In diesem Falle sind die Glieder des Klammerausdrucks sämtliche Glieder einer Formenreihe. <\/p>"}, {"n": "5.502", "h": "<p> Ich schreibe also statt „(– – – – –W)(<i>ξ, . . . .<\/i>)“ „<span>\\(\\displaystyle{ N ( \\bar{\\xi} ) }\\)<\/span>“. <\/p><p><span>\\(\\displaystyle{ N ( \\bar{\\xi} ) }\\)<\/span> ist die Negation sämtlicher Werte der Satzvariablen <i>ξ<\/i>. <\/p>"}, {"n": "5.503", "h": "<p> Da sich offenbar leicht ausdrücken lässt, wie mit dieser Operation Sätze gebildet werden können und wie Sätze mit ihr nicht zu bilden sind, so muss dies auch einen exakten Ausdruck finden können. <\/p>"}, {"n": "5.51", "h": "<p> Hat <i>ξ<\/i> nur einen Wert, so ist <span>\\(\\displaystyle{ N ( \\bar{\\xi} ) }\\)<\/span> = ∼<i>p<\/i> (nicht <i>p<\/i>), hat es zwei Werte, so ist <span>\\(\\displaystyle{ N ( \\bar{\\xi} ) }\\)<\/span> = ∼<i>p .<\/i> ∼<i>q<\/i> (weder <i>p<\/i> noch <i>q<\/i>). <\/p>"}, {"n": "5.511", "h": "<p> Wie kann die allumfassende, weltspiegelnde Logik so spezielle Haken und Manipulationen gebrauchen? Nur, indem sich alle diese zu einem unendlich feinen Netzwerk, zu dem grossen Spiegel, verknüpfen. <\/p>"}, {"n": "5.512", "h": "<p> „∼<i>p<\/i>“ ist wahr, wenn „<i>p<\/i>“ falsch ist. Also in dem wahren Satz „∼<i>p<\/i>“ ist „<i>p<\/i>“ ein falscher Satz. Wie kann ihn nun der Strich „∼“ mit der Wirklichkeit zum Stimmen bringen? <\/p><p>Das, was in „∼<i>p<\/i>“ verneint, ist aber nicht das „∼“, sondern dasjenige, was allen Zeichen dieser Notation, welche <i>p<\/i> verneinen, gemeinsam ist. <\/p><p>Also die gemeinsame Regel, nach welcher „∼<i>p<\/i>“, „∼∼∼<i>p<\/i>“, „∼<i>p<\/i> ∨ ∼<i>p<\/i>“, „∼<i>p .<\/i> ∼<i>p<\/i>“, etc. etc. (ad inf.) gebildet werden. Und dies Gemeinsame spiegelt die Verneinung wider. <\/p>"}, {"n": "5.513", "h": "<p> Man könnte sagen: Das Gemeinsame aller Symbole, die sowohl <i>p<\/i> als <i>q<\/i> bejahen, ist der Satz „<i>p . q<\/i>“. Das Gemeinsame aller Symbole, die entweder <i>p<\/i> oder <i>q<\/i> bejahen, ist der Satz „<i>p<\/i> ∨ <i>q<\/i>“. <\/p><p>Und so kann man sagen: Zwei Sätze sind einander entgegengesetzt, wenn sie nichts miteinander gemein haben, und: Jeder Satz hat nur ein Negativ, weil es nur einen Satz gibt, der ganz ausserhalb seiner liegt. <\/p><p>Es zeigt sich so auch in Russells Notation, dass „<i>q<\/i>&nbsp;: <i>p<\/i> ∨ ∼<i>p<\/i>“ dasselbe sagt wie „<i>q<\/i>“; dass „<i>p<\/i> ∨ ∼<i>p<\/i>“ nichts sagt. <\/p>"}, {"n": "5.514", "h": "<p> Ist eine Notation festgelegt, so gibt es in ihr eine Regel, nach der alle <i>p<\/i> verneinenden Sätze gebildet werden, eine Regel, nach der alle <i>p<\/i> bejahenden Sätze gebildet werden, eine Regel, nach der alle <i>p<\/i> oder <i>q<\/i> bejahenden Sätze gebildet werden, u. s. f. Diese Regeln sind den Symbolen äquivalent und in ihnen spiegelt sich ihr Sinn wider. <\/p>"}, {"n": "5.515", "h": "<p> Es muss sich an unseren Symbolen zeigen, dass das, was durch „∨“, „<i>.<\/i>“, etc. miteinander verbunden ist, Sätze sein müssen. <\/p><p>Und dies ist auch der Fall, denn das Symbol „<i>p<\/i>“ und „<i>q<\/i>“ setzt ja selbst das „∨“, „∼“, etc. voraus. Wenn das Zeichen „<i>p<\/i>“ in „<i>p<\/i>∨ <i>q<\/i>“ nicht für ein komplexes Zeichen steht, dann kann es allein nicht Sinn haben; dann können aber auch die mit „<i>p<\/i>“ gleichsinnigen Zeichen „<i>p<\/i> ∨ <i>p<\/i>“, „<i>p . p<\/i>“, etc. keinen Sinn haben. Wenn aber „<i>p<\/i> ∨ <i>p<\/i>“ keinen Sinn hat, dann kann auch „<i>p<\/i> ∨ <i>q<\/i>“ keinen Sinn haben. <\/p>"}, {"n": "5.5151", "h": "<p> Muss das Zeichen des negativen Satzes mit dem Zeichen des positiven gebildet werden? Warum sollte man den negativen Satz nicht durch eine negative Tatsache ausdrücken können. (Etwa: Wenn „<i>a<\/i>“ nicht in einer bestimmten Beziehung zu „<i>b<\/i>“ steht, könnte das ausdrücken, dass <i>aRb<\/i> nicht der Fall ist.) <\/p><p>Aber auch hier ist ja der negative Satz indirekt durch den positiven gebildet. <\/p><p>Der positive <em class=\"sp\">Satz<\/em> muss die Existenz des negativen <em class=\"sp\">Satzes<\/em> voraussetzen und umgekehrt. <\/p>"}, {"n": "5.52", "h": "<p> Sind die Werte von <i>ξ<\/i> sämtliche Werte einer Funktion <i>fx<\/i> für alle Werte von <i>x<\/i>, so wird <span>\\(\\displaystyle{ N ( \\bar{\\xi} ) }\\)<\/span> = ∼(∃<i>x<\/i>) <i>. fx<\/i>. <\/p>"}, {"n": "5.521", "h": "<p> Ich trenne den Begriff <em class=\"sp\">Alle<\/em> von der Wahrheitsfunktion. <\/p><p>Frege und Russell haben die Allgemeinheit in Verbindung mit dem logischen Produkt oder der logischen Summe eingeführt. So wurde es schwer, die Sätze „(∃<i>x<\/i>) <i>. fx<\/i>“ und „(<i>x<\/i>) <i>. fx<\/i>“, in welchen beide Ideen beschlossen liegen, zu verstehen. <\/p>"}, {"n": "5.522", "h": "<p> Das Eigentümliche der Allgemeinheitsbezeichnung ist erstens, dass sie auf ein logisches Urbild hinweist, und zweitens, dass sie Konstante hervorhebt. <\/p>"}, {"n": "5.523", "h": "<p> Die Allgemeinheitsbezeichnung tritt als Argument auf. <\/p>"}, {"n": "5.524", "h": "<p> Wenn die Gegenstände gegeben sind, so sind uns damit auch schon <em class=\"sp\">alle<\/em> Gegenstände gegeben. <\/p><p>Wenn die Elementarsätze gegeben sind, so sind damit auch <em class=\"sp\">alle<\/em> Elementarsätze gegeben. <\/p>"}, {"n": "5.525", "h": "<p> Es ist unrichtig, den Satz „(∃<i>x<\/i>) <i>. fx<\/i>“ – wie Russell dies tut – in Worten durch „<i>fx<\/i> ist <em class=\"sp\">möglich<\/em>“ wiederzugeben. <\/p><p>Gewissheit, Möglichkeit oder Unmöglichkeit einer Sachlage wird nicht durch einen Satz ausgedrückt, sondern dadurch, dass ein Ausdruck eine Tautologie, ein sinnvoller Satz, oder eine Kontradiktion ist. <\/p><p>Jener Präzedenzfall, auf den man sich immer berufen möchte, muss schon im Symbol selber liegen. <\/p>"}, {"n": "5.526", "h": "<p> Man kann die Welt vollständig durch vollkommen verallgemeinerte Sätze beschreiben, das heisst also, ohne irgend einen Namen von vornherein einem bestimmten Gegenstand zuzuordnen. <\/p><p>Um dann auf die gewöhnliche Ausdrucksweise zu kommen, muss man einfach nach einem Ausdruck „es gibt ein und nur ein <i>x<\/i>, welches <i>. . . .<\/i>“ sagen: Und dies <i>x<\/i> ist <i>a<\/i>. <\/p>"}, {"n": "5.5261", "h": "<p> Ein vollkommen verallgemeinerter Satz ist, wie jeder andere Satz zusammengesetzt. (Dies zeigt sich daran, dass wir in „(∃<i>x, ϕ<\/i>)<i>.ϕx<\/i>“ „<i>ϕ<\/i>“ und „<i>x<\/i>“ getrennt erwähnen müssen. Beide stehen unabhängig in bezeichnenden Beziehungen zur Welt, wie im unverallgemeinerten Satz.) <\/p><p>Kennzeichen des zusammengesetzten Symbols: Es hat etwas mit <em class=\"sp\">anderen<\/em> Symbolen gemeinsam. <\/p>"}, {"n": "5.5262", "h": "<p> Es verändert ja die Wahr- oder Falschheit <em class=\"sp\">jedes<\/em> Satzes etwas am allgemeinen Bau der Welt. Und der Spielraum, welcher ihrem Bau durch die Gesamtheit der Elementarsätze gelassen wird, ist eben derjenige, welchen die ganz allgemeinen Sätze begrenzen. <\/p><p>(Wenn ein Elementarsatz wahr ist, so ist damit doch jedenfalls Ein Elementarsatz <em class=\"sp\">mehr<\/em> wahr.) <\/p>"}, {"n": "5.53", "h": "<p> Gleichheit des Gegenstandes drücke ich durch Gleichheit des Zeichens aus, und nicht mit Hilfe eines Gleichheitszeichens. Verschiedenheit der Gegenstände durch Verschiedenheit der Zeichen. <\/p>"}, {"n": "5.5301", "h": "<p> Dass die Identität keine Relation zwischen Gegenständen ist, leuchtet ein. Dies wird sehr klar, wenn man z. B. den Satz „(<i>x<\/i>)&nbsp;:&nbsp;<i>fx.<\/i> ⊃<i>&nbsp;.x<\/i> =&nbsp;<i>a<\/i>“ betrachtet. Was dieser Satz sagt, ist einfach, dass <em class=\"sp\">nur<\/em> <i>a<\/i> der Funktion <i>f<\/i> genügt, und nicht, dass nur solche Dinge der Funktion <i>f<\/i> genügen, welche eine gewisse Beziehung zu <i>a<\/i> haben. <\/p><p>Man könnte nun freilich sagen, dass eben <em class=\"sp\">nur<\/em> <i>a<\/i> diese Beziehung zu <i>a<\/i> habe, aber um dies auszudrücken, brauchten wir das Gleichheitszeichen selber. <\/p>"}, {"n": "5.5302", "h": "<p> Russells Definition von „=“ genügt nicht; weil man nach ihr nicht sagen kann, dass zwei Gegenstände alle Eigenschaften gemeinsam haben. (Selbst wenn dieser Satz nie richtig ist, hat er doch <em class=\"sp\">Sinn<\/em>.) <\/p>"}, {"n": "5.5303", "h": "<p> Beiläufig gesprochen: Von <em class=\"sp\">zwei<\/em> Dingen zu sagen, sie seien identisch, ist ein Unsinn, und von <em class=\"sp\">Einem<\/em> zu sagen, es sei identisch mit sich selbst, sagt gar nichts. <\/p>"}, {"n": "5.531", "h": "<p> Ich schreibe also nicht „<i>f<\/i> (<i>a, b<\/i>) <i>. a<\/i> = <i>b<\/i>“, sondern „<i>f<\/i> (<i>a, a<\/i>)“ (oder „<i>f<\/i> (<i>b, b<\/i>)“). Und nicht „<i>f<\/i> (<i>a, b<\/i>) <i>.<\/i> ∼<i>a<\/i> = <i>b<\/i>“, sondern „<i>f<\/i> (<i>a, b<\/i>)“. <\/p>"}, {"n": "5.532", "h": "<p> Und analog: Nicht „(∃<i>x, y<\/i>) <i>. f<\/i> (<i>x, y<\/i>) <i>. x<\/i> = <i>y<\/i>“, sondern „(∃<i>x<\/i>) <i>. f<\/i> (<i>x, x<\/i>)“; und nicht „(∃<i>x, y<\/i>) <i>. f<\/i> (<i>x, y<\/i>) <i>.<\/i> ∼<i>x<\/i> = <i>y<\/i>“, sondern „(∃<i>x, y<\/i>) <i>. f<\/i> (<i>x, y<\/i>)“. <\/p><p>(Also statt des Russell’schen „(∃<i>x, y<\/i>) <i>. f<\/i> (<i>x, y<\/i>)“: „(∃<i>x, y<\/i>) <i>. f<\/i> (<i>x, y<\/i>) <i>.<\/i> ∨ <i>.<\/i> (∃<i>x<\/i>) <i>. f<\/i> (<i>x, x<\/i>)“.) <\/p>"}, {"n": "5.5321", "h": "<p> Statt „(<i>x<\/i>)&nbsp;: <i>fx<\/i> ⊃ <i>x<\/i> = <i>a<\/i>“ schreiben wir also z. B. „(∃<i>x<\/i>) <i>. fx.<\/i> ⊃ <i>.fa<\/i>&nbsp;: ∼(∃<i>x, y<\/i>) <i>. fx . fy<\/i>“. <\/p><p>Und der Satz „<em class=\"sp\">nur<\/em> Ein <i>x<\/i> befriedigt <i>f<\/i> ()“ lautet: „(∃<i>x<\/i>) <i>. fx<\/i>&nbsp;: ∼(∃<i>x, y<\/i>) <i>. fx . fy<\/i>“. <\/p>"}, {"n": "5.533", "h": "<p> Das Gleichheitszeichen ist also kein wesentlicher Bestandteil der Begriffsschrift. <\/p>"}, {"n": "5.534", "h": "<p> Und nun sehen wir, dass Scheinsätze wie: „<i>a<\/i> = <i>a<\/i>“, „<i>a<\/i> = <i>b . b<\/i> = <i>c.<\/i> ⊃ <i>a<\/i> = <i>c<\/i>“, „(<i>x<\/i>) <i>. x<\/i> = <i>x<\/i>“, „(∃<i>x<\/i>) <i>. x<\/i> = <i>a<\/i>“, etc. sich in einer richtigen Begriffsschrift gar nicht hinschreiben lassen. <\/p>"}, {"n": "5.535", "h": "<p> Damit erledigen sich auch alle Probleme, die an solche Scheinsätze geknüpft waren. <\/p><p>Alle Probleme, die Russells „Axiom of infinity“ mit sich bringt, sind schon hier zu lösen. <\/p><p>Das, was das Axiom of infinity sagen soll, würde sich in der Sprache dadurch ausdrücken, dass es unendlich viele Namen mit verschiedener Bedeutung gäbe. <\/p>"}, {"n": "5.5351", "h": "<p> Es gibt gewisse Fälle, wo man in Versuchung gerät, Ausdrücke von der Form „<i>a<\/i> = <i>a<\/i>“ oder „<i>p<\/i> ⊃ <i>p<\/i>“ u. dgl. zu benützen. Und zwar geschieht dies, wenn man von dem Urbild: Satz, Ding, etc. reden möchte. So hat Russell in den „Principles of Mathematics“ den Unsinn „<i>p<\/i> ist ein Satz“ in Symbolen durch „<i>p<\/i> ⊃ <i>p<\/i>“ wiedergegeben und als Hypothese vor gewisse Sätze gestellt, damit deren Argumentstellen nur von Sätzen besetzt werden könnten. <\/p><p>(Es ist schon darum Unsinn, die Hypothese <i>p<\/i> ⊃ <i>p<\/i> vor einen Satz zu stellen, um ihm Argumente der richtigen Form zu sichern, weil die Hypothese für einen Nicht-Satz als Argument nicht falsch, sondern unsinnig wird, und weil der Satz selbst durch die unrichtige Gattung von Argumenten unsinnig wird, also sich selbst ebenso gut, oder so schlecht, vor den unrechten Argumenten bewahrt, wie die zu diesem Zweck angehängte sinnlose Hypothese.) <\/p>"}, {"n": "5.5352", "h": "<p> Ebenso wollte man „Es gibt keine <em class=\"sp\">Dinge<\/em>“ ausdrücken durch „∼(∃<i>x<\/i>) <i>. x<\/i> = <i>x<\/i>“. Aber selbst wenn dies ein Satz wäre, – wäre er nicht auch wahr, wenn es zwar „Dinge gäbe“, aber diese nicht mit sich selbst identisch wären? <\/p>"}, {"n": "5.54", "h": "<p> In der allgemeinen Satzform kommt der Satz im Satze nur als Basis der Wahrheitsoperationen vor. <\/p>"}, {"n": "5.541", "h": "<p> Auf den ersten Blick scheint es, als könne ein Satz in einem anderen auch auf andere Weise vorkommen. <\/p><p>Besonders in gewissen Satzformen der Psychologie, wie „A glaubt, dass <i>p<\/i> der Fall ist“, oder „A denkt <i>p<\/i>“, etc. <\/p><p>Hier scheint es nämlich oberflächlich, als stünde der Satz <i>p<\/i> zu einem Gegenstand A in einer Art von Relation. <\/p><p>(Und in der modernen Erkenntnistheorie (Russell, Moore, etc.) sind jene Sätze auch so aufgefasst worden.) <\/p>"}, {"n": "5.542", "h": "<p> Es ist aber klar, dass „A glaubt, dass <i>p<\/i>“, „A denkt <i>p<\/i>“, „A sagt <i>p<\/i>“ von der Form „‚<i>p<\/i>‘ sagt <i>p<\/i>“ sind: Und hier handelt es sich nicht um eine Zuordnung von einer Tatsache und einem Gegenstand, sondern um die Zuordnung von Tatsachen durch Zuordnung ihrer Gegenstände. <\/p>"}, {"n": "5.5421", "h": "<p> Dies zeigt auch, dass die Seele – das Subjekt, etc. – wie sie in der heutigen oberflächlichen Psychologie aufgefasst wird, ein Unding ist. <\/p><p>Eine zusammengesetzte Seele wäre nämlich keine Seele mehr. <\/p>"}, {"n": "5.5422", "h": "<p> Die richtige Erklärung der Form des Satzes „A urteilt <i>p<\/i>“ muss zeigen, dass es unmöglich ist, einen Unsinn zu urteilen. (Russells Theorie genügt dieser Bedingung nicht.) <\/p>"}, {"n": "5.5423", "h": "<p> Einen Komplex wahrnehmen, heisst, wahrnehmen, dass sich seine Bestandteile so und so zu einander verhalten. <\/p><p>Dies erklärt wohl auch, dass man die Figur <\/p><figure><span><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAEHCAYAAACHl1tOAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOy9d5yV1fE//r537/ZdlqIIWKLBWCOxm9hiwZgX1mBUpGgUNRYsxK5IFLASjRgLVRQLgQiKYO8hMTEaY0xUxIhYQEXAFbbvvff8/iDP8zl3dmbOPHcXk+/vlXm99nWf55SZ98yZMzPn2VtSzjmHf5NzDqlUKn7l2gGofT7540J8/H4OC9cnYbb0U4wSJg07veZsR3lL15wci/04DBZbWu0f0kHCl3R9qIzQuGL8xKfQ+lnWLIRXm0MpZDcLPw1ThhvILbCkkHSvzZfmce30VVu8ED/JKPReMjLVw5elLQq3eNpiSfpojizZgdpSwuPL5uzK6c/x0OYUs0k0fTj9NSycf0t+Jl1z6xHx5MaH1lxKLFRGEjtRTM45pNwGUh3aN5hlA1j7fbBSvy/bYhjNEJSXhikkx0oaLymjUFw+Vuu4zuIMZRTJWbsaVwizTyE7FzN2Y2OmcpLa2+er+W+aDuQiF50sRTopYvkAONB0DDWI5lDaPceXYqZtFL/PT6pUisFM+zn7cZtP4k314BxKw8zpLPH1nc+fp+Gn4ygWri9kc+qvEg86juoajed8UpNP5Wl+QO3jy5Ew+3O0AKqtW9SXpgI5o3ECpEwTIs1xLdmMU0Lq53jSPupMXH80X6sMQhsraRvnnH4fnWd1AM7ZJCyaA3G8OB3oPecnWnDSMFkqCut8aXNr86kNQz4o6Ubl++1UFhdstD0V83IMCi6iSMJ8BbWSgkZ7a3Dg5vsYtEqCKk/1kHQOYaB8QsFEckTOzlI71Y/ikOZb9aQyNftJWCR7aLwljBZ5XHsSmZqemq9L7ZocaYy01la9JbmUb0HpzkUILtL47Rwg6dUf679SgDST+vK0PspfiticTMqbw8vJCkVwCTMXPDi7aNlSivJadtccJ4RZsjOnF5VJ+yTi/EsK4NK173fSJuDWXKtuQlWDNl9ac2ndOF5RG7dOWiKJrtO+EH8zUdIyi3QtAaYbSiptpHaqGBek6Fy6+P61VjGEMHHOSOWEHILTiesLZVqpOgjpwuGW5NANkjQQUfmaH/j4QoGc4tN0DQWi0HpJgVTSk+MhyYrGSrpLyTN0n+GES0C5/iRRLRRA6DhuAUObRMMsXWt8tMXjyN8IUiT3Ayp9teCWMEvRnGKjlQNnB25zSRuOW1t/rFZFcbhoALZkSulesqmkN8WjBTQLPmnNNVuFkg7Fpc2P+jKUAWcACkZzPG68NI46uDYvaZnkj+P6NH6WLC8FF65fsyvXrwVEqw5aYOWCjCQ3xD+kmySf6mXxBS0wafdcIKH8LdVBks2uzeGIs6VlzX0MklznhIdxEoCupI3FtyvkdBbbN6Wbhf5b7axl7P9R11Oa1vzcGUA6f0Tt1j9/nsSHu5dwcfg0OdpYv08r4UNzqQ6WPk6ORbbVzqFMHZIXuuYyY0h/iY+mDyc/pKdmM2mOREn5h9Y8pKfG3zLWpw5ndOmeKyekkoFGa26M ches Problem durch Ansehen der Welt beantworten zu müssen, so zeigt dies, dass wir auf grundfalscher Fährte sind.) <\/p>"}, {"n": "5.552", "h": "<p> Die „Erfahrung“, die wir zum Verstehen der Logik brauchen, ist nicht die, dass sich etwas so und so verhält, sondern, dass etwas <em class=\"sp\">ist<\/em>: aber das ist eben <em class=\"sp\">keine<\/em> Erfahrung. <\/p><p>Die Logik ist <em class=\"sp\">vor<\/em> jeder Erfahrung – dass etwas <em class=\"sp\">so<\/em> ist. Sie ist vor dem Wie, nicht vor dem Was. <\/p>"}, {"n": "5.5521", "h": "<p> Und wenn dies nicht so wäre, wie könnten wir die Logik anwenden? Man könnte sagen: Wenn es eine Logik gäbe, auch wenn es keine Welt gäbe, wie könnte es dann eine Logik geben, da es eine Welt gibt. <\/p>"}, {"n": "5.553", "h": "<p> Russell sagte, es gäbe einfache Relationen zwischen verschiedenen Anzahlen von Dingen (Individuals). Aber zwischen welchen Anzahlen? Und wie soll sich das entscheiden? – Durch die Erfahrung? <\/p><p>(Eine ausgezeichnete Zahl gibt es nicht.) <\/p>"}, {"n": "5.554", "h": "<p> Die Angabe jeder speziellen Form wäre vollkommen willkürlich. <\/p>"}, {"n": "5.5541", "h": "<p> Es soll sich a priori angeben lassen, ob ich z. B. in die Lage kommen kann, etwas mit dem Zeichen einer 27-stelligen Relation bezeichnen zu müssen. <\/p>"}, {"n": "5.5542", "h": "<p> Dürfen wir denn aber überhaupt so fragen? Können wir eine Zeichenform aufstellen und nicht wissen, ob ihr etwas entsprechen könne? <\/p><p>Hat die Frage einen Sinn: Was muss <em class=\"sp\">sein<\/em>, damit etwas der-Fall-sein kann? <\/p>"}, {"n": "5.555", "h": "<p> Es ist klar, wir haben vom Elementarsatz einen Begriff, abgesehen von seiner besonderen logischen Form. <\/p><p>Wo man aber Symbole nach einem System bilden kann, dort ist dieses System das logisch wichtige und nicht die einzelnen Symbole. <\/p><p>Und wie wäre es auch möglich, dass ich es in der Logik mit Formen zu tun hätte, die ich erfinden kann; sondern mit dem muss ich es zu tun haben, was es mir möglich macht, sie zu erfinden. <\/p>"}, {"n": "5.556", "h": "<p> Eine Hierarchie der Formen der Elementarsätze kann es nicht geben. Nur was wir selbst konstruieren, können wir voraussehen. <\/p>"}, {"n": "5.5561", "h": "<p> Die empirische Realität ist begrenzt durch die Gesamtheit der Gegenstände. Die Grenze zeigt sich wieder in der Gesamtheit der Elementarsätze. <\/p><p>Die Hierarchien sind, und müssen unabhängig von der Realität sein. <\/p>"}, {"n": "5.5562", "h": "<p> Wissen wir aus rein logischen Gründen, dass es Elementarsätze geben muss, dann muss es jeder wissen, der die Sätze in ihrer unanalysierten Form versteht. <\/p>"}, {"n": "5.5563", "h": "<p> Alle Sätze unserer Umgangssprache sind tatsächlich, so wie sie sind, logisch vollkommen geordnet. – Jenes Einfachste, was wir hier angeben sollen, ist nicht ein Gleichnis der Wahrheit, sondern die volle Wahrheit selbst. <\/p><p>(Unsere Probleme sind nicht abstrakt, sondern vielleicht die konkretesten, die es gibt.) <\/p>"}, {"n": "5.557", "h": "<p> Die <em class=\"sp\">Anwendung<\/em> der Logik entscheidet darüber, welche Elementarsätze es gibt. <\/p><p>Was in der Anwendung liegt, kann die Logik nicht vorausnehmen. <\/p><p>Das ist klar: Die Logik darf mit ihrer Anwendung nicht kollidieren. <\/p><p>Aber die Logik muss sich mit ihrer Anwendung berühren. <\/p><p>Also dürfen die Logik und ihre Anwendung einander nicht übergreifen. <\/p>"}, {"n": "5.5571", "h": "<p> Wenn ich die Elementarsätze nicht a priori angeben kann, dann muss es zu offenbarem Unsinn führen, sie angeben zu wollen. <\/p>"}, {"n": "5.6", "h": "<p> <em class=\"sp\">Die Grenzen meiner Sprache<\/em> bedeuten die Grenzen meiner Welt. <\/p>"}, {"n": "5.61", "h": "<p> Die Logik erfüllt die Welt; die Grenzen der Welt sind auch ihre Grenzen. <\/p><p>Wir können also in der Logik nicht sagen: Das und das gibt es in der Welt, jenes nicht. <\/p><p>Das würde nämlich scheinbar voraussetzen, dass wir gewisse Möglichkeiten ausschliessen und dies kann nicht der Fall sein, da sonst die Logik über die Grenzen der Welt hinaus müsste; wenn sie nämlich diese Grenzen auch von der anderen Seite betrachten könnte. <\/p><p>Was wir nicht denken können, das können wir nicht denken; wir können also auch nicht <em class=\"sp\">sagen<\/em>, was wir nicht denken können. <\/p>"}, {"n": "5.62", "h": "<p> Diese Bemerkung gibt den Schlüssel zur Entscheidung der Frage, inwieweit der Solipsismus eine Wahrheit ist. <\/p><p>Was der Solipsismus nämlich <em class=\"sp\">meint<\/em>, ist ganz richtig, nur lässt es sich nicht <em class=\"sp\">sagen<\/em>, sondern es zeigt sich. <\/p><p>Dass die Welt <em class=\"sp\">meine<\/em> Welt ist, das zeigt sich darin, dass die Grenzen <em class=\"sp\">der<\/em> Sprache (der Sprache, die allein ich verstehe) die Grenzen <em class=\"sp\">meiner<\/em> Welt bedeuten. <\/p>"}, {"n": "5.621", "h": "<p> Die Welt und das Leben sind Eins. <\/p>"}, {"n": "5.63", "h": "<p> Ich bin meine Welt. (Der Mikrokosmos.) <\/p>"}, {"n": "5.631", "h": "<p> Das denkende, vorstellende, Subjekt gibt es nicht. <\/p><p>Wenn ich ein Buch schriebe „Die Welt, wie ich sie vorfand“, so wäre darin auch über meinen Leib zu berichten und zu sagen, welche Glieder meinem Willen unterstehen und welche nicht etc., dies ist nämlich eine Methode, das Subjekt zu isolieren, oder vielmehr zu zeigen, dass es in einem wichtigen Sinne kein Subjekt gibt: Von ihm allein nämlich könnte in diesem Buche <em class=\"sp\">nicht<\/em> die Rede sein. – <\/p>"}, {"n": "5.632", "h": "<p> Das Subjekt gehört nicht zur Welt, sondern es ist eine Grenze der Welt. <\/p>"}, {"n": "5.633", "h": "<p> Wo in der Welt ist ein metaphysisches Subjekt zu merken? <\/p><p>Du sagst, es verhält sich hier ganz, wie mit Auge und Gesichtsfeld. Aber das Auge siehst du wirklich <em class=\"sp\">nicht<\/em>. <\/p><p>Und nichts <em class=\"sp\">am Gesichtsfeld<\/em> lässt darauf schliessen, dass es von einem Auge gesehen wird. <\/p>"}, {"n": "5.6331", "h": "<p> Das Gesichtsfeld hat nämlich nicht etwa eine solche Form: <\/p><figure><span><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAACRCAYAAADq36WkAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nO2deXgV1fnHv/fmZiELhJAEJCxhEQkgosgWwiqIEPUBKhVaCKA8CrZWXFppsRUf2sdHaV1qpaTiymLZFLBsClQWTWQTgYDsshtiEnKT3EuSe+f9/cFvpnNPzpmZm9ybOzfM93nyZOY9n7PMmbO8Z2bujE2SJAIAm80GIoLNZgMAEBFk+WOT05DtLKfe95eTbWbl1HYea9mM28xSjsZis7MBROTTedU2dUKynZc4K9EAYpRTl00UZgZOvW/Z6mdjty1b/WwOtvPqiTd78dJQ23gzIy+uFscrg1k5rfiWzbKFwmavRUB71pUT4Y3EenHqw7F5qQccs3Bsnai31Z6KxRnj1CzPm7Q4Pzjyp7dasmQpLOXg9XO1i6oeOdQ2vTW3iGNnRKOcmtfK1wwcW3dsmMXpc3phFucfV8t1V4N6rqy6g2q5EGxHVrNGOVHavLxDzalZvSWLxfHFC9ca+C1Om6uT667VCYMpo/makfNnELM4Mad3LiyOL3sd+rnm7K0lImMX8HicGTsvy/G2Wcbi6s4Bvm3P4oxzNkmSiIV4HZnn+7MSrRkCwYmkV6aG5rSWJhbnH8drd2pZnHHOuupuydJNoFpPxmltq23+uFs3i+qzNLE445zMWpxxjrtGV0/9ItlsNh+XixdH3hYNFo2NA/SvJluccU6rvi3OP85y3S1ZugnEfQTWkiVLjUsO9goezwVnw3nbRjk2faOcWrz7hmbhjN56tDh9Tm/paHHGOZv8e3QZ4l26F13K1+q0WgUxslowyllqnOKdf8tWd5tDBLJi782JEuV1flFa/nCivHkKFSfiRcdocWJOlrptaU0+FqfNOWSQdUtFrjPPfVVLDtMbPPzl1GUyK1eXcIsTi1f/Wp6lxYk5u9zZRBKNwOqERSMKO+rUlVPLzGtKnk1rILM4MSdqX+p0LM445/PAjF7jZk+UelsrjMf4w4niaClUHDtQyXFZm8Vpc6KJwOLqxtV61p0ndQR5nxfHqNtWF7FlMLuN55VYNv9sRtqSxRnjfB6YUQdqJchygHjGY0cf9X9/Oa1GYhbODCe1MXCidiVqExanzSkdvT4NtyEkGhwsW+O1WQqcrEdggyQzzIrhzgF8T9GoR2lxqhldXqMbcU95jL8c65ob5USuvjp+qDnemCk6IRanzZnhfDYmzq70eOa/OoJ6W/4TMaxN7+QZ5WTGSKMJFcerGzYdi6s7J8vi/OdqPevORlRLNAOzjDo9drsuHFsmXhwzcLxBjFevFmeMk23qeCIREaqrq1FcXIzTp0/j4sWLOHHiBH788UdER0ejc+fOSE5ORnx8PBISEtCuXTu0aNEC8fHxhrwLrXzDgXOod9hA9Wyrd6J4LizvpNWV0+p4ZuTU9WjZ6mYD/lffkiShpKQER48excWLF3HlyhWcOXMGLpcL165dw4ULF3DhwgVcv34dFRUVwvRkxcbGIiYmBsnJybj99tvRrVs33H333bjrrruQlpbGbeO8gShcOEP30bUk6qz1YbU8AJYzo403UPEGTYurHeZ2u1FSUoKCggIcOnQI+/fvx4ULF3DkyBF4PB64XC7NTtyqVSt06dIFsbGxtc5RTU0NqqurUVNTg4qKCly8eBGlpaU+TJMmTdCxY0eMGTMGY8eORb9+/WC333iuTHRMcpjWBBlyjm5Ic4atj/S8AyMcWz4zc1rHaXH/s12/fh179uzBmjVrcOLECfz000+4dOkSSkpKIEkSPB6PT71HRUWhW7duaNmyJTp06IA2bdqgefPmSEhIQOfOnZGYmIimTZsiOTkZkZGRsNlqr1eJ/ud5yXkUFRXhu+++w8GDB5GXl4fd }, {"n": "6.001", "h": "<p> Dies sagt nichts anderes, als dass jeder Satz ein Resultat der successiven Anwendung der Operation <span>\\(\\displaystyle{ N' (\\bar{\\xi}) }\\)<\/span> auf die Elementarsätze ist. <\/p>"}, {"n": "6.002", "h": "<p> Ist die allgemeine Form gegeben, wie ein Satz gebaut ist, so ist damit auch schon die allgemeine Form davon gegeben, wie aus einem Satz durch eine Operation ein anderer erzeugt werden kann. <\/p>"}, {"n": "6.01", "h": "<p> Die allgemeine Form der Operation <span>\\(\\displaystyle{ \\Omega ' (\\bar{\\eta}) }\\)<\/span> ist also: <span>\\(\\displaystyle{ [\\bar{\\xi}, N(\\bar{\\xi})]' (\\bar{\\eta}) (= [ \\bar{\\eta}, \\bar{\\xi}, N (\\bar{\\xi}) ]) }\\)<\/span>. <\/p><p>Das ist die allgemeinste Form des Überganges von einem Satz zum anderen. <\/p>"}, {"n": "6.02", "h": "<p> Und so kommen wir zu den Zahlen: Ich definiere <\/p><p><span>\\(\\displaystyle{ x = \\Omega^{0 \\prime} x \\text{ Def.} }\\)<\/span>&nbsp;und <span>\\(\\displaystyle{ \\Omega^{\\prime} \\Omega^{\\nu \\prime} x = \\Omega^{\\nu + 1 \\prime} x \\text{ Def.} }\\)<\/span><\/p><p>Nach diesen Zeichenregeln schreiben wir also die Reihe <span>\\(\\displaystyle{ x, \\Omega ' x, \\Omega ' \\Omega ' x, \\Omega ' \\Omega ' \\Omega ' x, ..... }\\)<\/span> <\/p><p>so: <span>\\(\\displaystyle{ \\Omega^{0 \\prime} x, \\Omega^{0+1 \\prime} x, \\Omega^{0 + 1 + 1 \\prime} x, \\Omega^{0 + 1 + 1 + 1 \\prime} x, ..... }\\)<\/span><\/p><p>Also schreibe ich statt „<span>\\(\\displaystyle{ [ x, \\xi, \\Omega ' \\xi ] }\\)<\/span>“: <\/p><p>„<span>\\(\\displaystyle{ [ \\Omega^{0 \\prime} x, \\Omega^{\\nu \\prime} x, \\Omega^{\\nu + 1 \\prime} x ] }\\)<\/span>“.<\/p><p>Und definiere: <\/p><p><span>\\(\\displaystyle{ 0 + 1 = 1 \\text{ Def.} }\\)<\/span><\/p><p><span>\\(\\displaystyle{ 0 + 1 + 1 = 2 \\text{ Def.} }\\)<\/span><\/p><p><span>\\(\\displaystyle{ 0 + 1 + 1 + 1 = 3 \\text{ Def.} }\\)<\/span><\/p><p>(u. s. f.)<\/p>"}, {"n": "6.021", "h": "<p> Die Zahl ist der Exponent einer Operation. <\/p>"}, {"n": "6.022", "h": "<p> Der Zahlbegriff ist nichts anderes, als das Gemeinsame aller Zahlen, die allgemeine Form der Zahl. <\/p><p>Der Zahlbegriff ist die variable Zahl. <\/p><p>Und der Begriff der Zahlengleichheit ist die allgemeine Form aller speziellen Zahlengleichheiten. <\/p>"}, {"n": "6.03", "h": "<p> Die allgemeine Form der ganzen Zahl ist: <span>\\(\\displaystyle{ [ 0, \\xi, \\xi + 1] }\\)<\/span>. <\/p>"}, {"n": "6.031", "h": "<p> Die Theorie der Klassen ist in der Mathematik ganz überflüssig. <\/p><p>Dies hängt damit zusammen, dass die Allgemeinheit, welche wir in der Mathematik brauchen, nicht die <em class=\"sp\">zufällige<\/em> ist. <\/p>"}, {"n": "6.1", "h": "<p> Die Sätze der Logik sind Tautologien. <\/p>"}, {"n": "6.11", "h": "<p> Die Sätze der Logik sagen also Nichts. (Sie sind die analytischen Sätze.) <\/p>"}, {"n": "6.111", "h": "<p> Theorien, die einen Satz der Logik gehaltvoll erscheinen lassen, sind immer falsch. Man könnte z. B. glauben, dass die Worte „wahr“ und „falsch“ zwei Eigenschaften unter anderen Eigenschaften bezeichnen, und da erschiene es als eine merkwürdige Tatsache, dass jeder Satz eine dieser Eigenschaften besitzt. Das scheint nun nichts weniger als selbstverständlich zu sein, ebensowenig selbstverständlich, wie etwa der Satz, „alle Rosen sind entweder gelb oder rot“ klänge, auch wenn er wahr wäre. Ja, jener Satz bekommt nun ganz den Charakter eines naturwissenschaftlichen Satzes und dies ist das sichere Anzeichen dafür, dass er falsch aufgefasst wurde. <\/p>"}, {"n": "6.112", "h": "<p> Die richtige Erklärung der logischen Sätze muss ihnen eine einzigartige Stellung unter allen Sätzen geben. <\/p>"}, {"n": "6.113", "h": "<p> Es ist das besondere Merkmal der logischen Sätze, dass man am Symbol allein erkennen kann, dass sie wahr sind, und diese Tatsache schliesst die ganze Philosophie der Logik in sich. Und so ist es auch eine der wichtigsten Tatsachen, dass sich die Wahrheit oder Falschheit der nicht-logischen Sätze <em class=\"sp\">nicht<\/em> am Satz allein erkennen lässt. <\/p>"}, {"n": "6.12", "h": "<p> Dass die Sätze der Logik Tautologien sind, das <em class=\"sp\">zeigt<\/em> die formalen – logischen – Eigenschaften der Sprache, der Welt. <\/p><p>Dass ihre Bestandteile <em class=\"sp\">so<\/em> verknüpft eine Tautologie ergeben, das charakterisiert die Logik ihrer Bestandteile. <\/p><p>Damit Sätze, auf bestimmte Art und Weise verknüpft, eine Tautologie ergeben, dazu müssen sie bestimmte Eigenschaften der Struktur haben. Dass sie <em class=\"sp\">so<\/em> verbunden eine Tautologie ergeben, zeigt also, dass sie diese Eigenschaften der Struktur besitzen. <\/p>"}, {"n": "6.1201", "h": "<p> Dass z. B. die Sätze „<i>p<\/i>“ und „∼<i>p<\/i>“ in der Verbindung „∼(<i>p.<\/i>∼<i>p<\/i>)“ eine Tautologie ergeben, zeigt, dass sie einander widersprechen. Dass die Sätze „<i>p<\/i> ⊃ <i>q<\/i>“, „<i>p<\/i>“ und „<i>q<\/i>“ in der Form „(<i>p<\/i> ⊃ <i>q<\/i>)<i>.<\/i>(<i>p<\/i>)&nbsp;: ⊃&nbsp;: (<i>q<\/i>)“ miteinander verbunden eine Tautologie ergeben, zeigt, dass <i>q<\/i> aus <i>p<\/i> und <i>p<\/i> ⊃ <i>q<\/i> folgt. Dass „(<i>x<\/i>) <i>. fx<\/i>&nbsp;: ⊃&nbsp;: <i>fa<\/i>“ eine Tautologie ist, dass <i>fa<\/i> aus (<i>x<\/i>) <i>. fx<\/i> folgt. etc. etc. <\/p>"}, {"n": "6.1202", "h": "<p> Es ist klar, dass man zu demselben Zweck statt der Tautologien auch die Kontradiktionen verwenden könnte. <\/p>"}, {"n": "6.1203", "h": "<p> Um eine Tautologie als solche zu erkennen, kann man sich, in den Fällen, in welchen in der Tautologie keine Allgemeinheitsbezeichnung vorkommt, folgender anschaulichen Methode bedienen: Ich schreibe statt „<i>p<\/i>“, „<i>q<\/i>“, „<i>r<\/i>“ etc. „W<i>p<\/i>F“, „W<i>q<\/i>F“, „W<i>r<\/i>F“ etc. Die Wahrheitskombinationen drücke ich durch Klammern aus. z. B.: <\/p><figure><span><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAB7CAYAAABdAJ1AAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nNV9eZxU1ZX/t6p6X+imocEGWbtthKi4RWQMmFFcRnGJxokfB+O4oVnGBcVxN en Sätzen verbinden. <\/p><p>Diese Methode könnte man auch eine Nullmethode nennen. Im logischen Satz werden Sätze miteinander ins Gleichgewicht gebracht und der Zustand des Gleichgewichts zeigt dann an, wie diese Sätze logisch beschaffen sein müssen. <\/p>"}, {"n": "6.122", "h": "<p> Daraus ergibt sich, dass wir auch ohne die logischen Sätze auskommen können, da wir ja in einer entsprechenden Notation die formalen Eigenschaften der Sätze durch das blosse Ansehen dieser Sätze erkennen können. <\/p>"}, {"n": "6.1221", "h": "<p> Ergeben z. B. zwei Sätze „<i>p<\/i>“ und „<i>q<\/i>“ in der Verbindung „<i>p<\/i> ⊃ <i>q<\/i>“ eine Tautologie, so ist klar, dass <i>q<\/i> aus <i>p<\/i> folgt. <\/p><p>Dass z. B. „<i>q<\/i>“ aus „<i>p<\/i> ⊃ <i>q . p<\/i>“ folgt, ersehen wir aus diesen beiden Sätzen selbst, aber wir können es auch <em class=\"sp\">so<\/em> zeigen, indem wir sie zu „<i>p<\/i> ⊃ <i>q . p<\/i>&nbsp;: ⊃&nbsp;: <i>q<\/i>“ verbinden und nun zeigen, dass dies eine Tautologie ist. <\/p>"}, {"n": "6.1222", "h": "<p> Dies wirft ein Licht auf die Frage, warum die logischen Sätze nicht durch die Erfahrung bestätigt werden können, ebenso wenig, wie sie durch die Erfahrung widerlegt werden können. Nicht nur muss ein Satz der Logik durch keine mögliche Erfahrung widerlegt werden können, sondern er darf auch nicht durch eine solche bestätigt werden können. <\/p>"}, {"n": "6.1223", "h": "<p> Nun wird klar, warum man oft fühlte, als wären die „logischen Wahrheiten“ von uns zu „<em class=\"sp\">fordern<\/em>“: Wir können sie nämlich insofern fordern, als wir eine genügende Notation fordern können. <\/p>"}, {"n": "6.1224", "h": "<p> Es wird jetzt auch klar, warum die Logik die Lehre von den Formen und vom Schliessen genannt wurde. <\/p>"}, {"n": "6.123", "h": "<p> Es ist klar: Die logischen Gesetze dürfen nicht selbst wieder logischen Gesetzen unterstehen. <\/p><p>(Es gibt nicht, wie Russell meinte, für jede „Type“ ein eigenes Gesetz des Widerspruches, sondern Eines genügt, da es auf sich selbst nicht angewendet wird.) <\/p>"}, {"n": "6.1231", "h": "<p> Das Anzeichen des logischen Satzes ist <em class=\"sp\">nicht<\/em> die Allgemeingültigkeit. <\/p><p>Allgemein sein, heisst ja nur: Zufälligerweise für alle Dinge gelten. Ein unverallgemeinerter Satz kann ja ebensowohl tautologisch sein, als ein verallgemeinerter. <\/p>"}, {"n": "6.1232", "h": "<p> Die logische Allgemeingültigkeit könnte man wesentlich nennen, im Gegensatz zu jener zufälligen, etwa des Satzes „alle Menschen sind sterblich“. Sätze, wie Russells „Axiom of reducibility“ sind nicht logische Sätze, und dies erklärt unser Gefühl: Dass sie, wenn wahr, so doch nur durch einen günstigen Zufall wahr sein könnten. <\/p>"}, {"n": "6.1233", "h": "<p> Es lässt sich eine Welt denken, in der das Axiom of reducibility nicht gilt. Es ist aber klar, dass die Logik nichts mit der Frage zu schaffen hat, ob unsere Welt wirklich so ist oder nicht. <\/p>"}, {"n": "6.124", "h": "<p> Die logischen Sätze beschreiben das Gerüst der Welt, oder vielmehr, sie stellen es dar. Sie „handeln“ von nichts. Sie setzen voraus, dass Namen Bedeutung, und Elementarsätze Sinn haben: Und dies ist ihre Verbindung mit der Welt. Es ist klar, dass es etwas über die Welt anzeigen muss, dass gewisse Verbindungen von Symbolen – welche wesentlich einen bestimmten Charakter haben – Tautologien sind. Hierin liegt das Entscheidende. Wir sagten, manches an den Symbolen, die wir gebrauchen, wäre willkürlich, manches nicht. In der Logik drückt nur dieses aus: Dass heisst aber, in der Logik drücken nicht <em class=\"sp\">wir<\/em> mit Hilfe der Zeichen aus, was wir wollen, sondern in der Logik sagt die Natur der naturnotwendigen Zeichen selbst aus: Wenn wir die logische Syntax irgend einer Zeichensprache kennen, dann sind bereits alle Sätze der Logik gegeben. <\/p>"}, {"n": "6.125", "h": "<p> Es ist möglich, und zwar auch nach der alten Auffassung der Logik, von vornherein eine Beschreibung aller „wahren“ logischen Sätze zu geben. <\/p>"}, {"n": "6.1251", "h": "<p> Darum kann es in der Logik auch <em class=\"sp\">nie<\/em> Überraschungen geben. <\/p>"}, {"n": "6.126", "h": "<p> Ob ein Satz der Logik angehört, kann man berechnen, indem man die logischen Eigenschaften des <em class=\"sp\">Symbols<\/em> berechnet. Und dies tun wir, wenn wir einen logischen Satz „beweisen“. Denn, ohne uns um einen Sinn und eine Bedeutung zu kümmern, bilden wir den logischen Satz aus anderen nach blossen <em class=\"sp\">Zeichenregeln<\/em>. <\/p><p>Der Beweis der logischen Sätze besteht darin, dass wir sie aus anderen logischen Sätzen durch successive Anwendung gewisser Operationen entstehen lassen, die aus den ersten immer wieder Tautologien erzeugen. (Und zwar <em class=\"sp\">folgen<\/em> aus einer Tautologie nur Tautologien.) <\/p><p>Natürlich ist diese Art zu zeigen, dass ihre Sätze Tautologien sind, der Logik durchaus unwesentlich. Schon darum, weil die Sätze, von welchen der Beweis ausgeht, ja ohne Beweis zeigen müssen, dass sie Tautologien sind. <\/p>"}, {"n": "6.1261", "h": "<p> In der Logik sind Prozess und Resultat äquivalent. (Darum keine Überraschung.) <\/p>"}, {"n": "6.1262", "h": "<p> Der Beweis in der Logik ist nur ein mechanisches Hilfsmittel zum leichteren Erkennen der Tautologie, wo sie kompliziert ist. <\/p>"}, {"n": "6.1263", "h": "<p> Es wäre ja auch zu merkwürdig, wenn man einen sinnvollen Satz <em class=\"sp\">logisch<\/em> aus anderen beweisen könnte, und einen logischen Satz <em class=\"sp\">auch<\/em>. Es ist von vornherein klar, dass der logische Beweis eines sinnvollen Satzes und der Beweis <em class=\"sp\">in<\/em> der Logik zwei ganz verschiedene Dinge sein müssen. <\/p>"}, {"n": "6.1264", "h": "<p> Der sinnvolle Satz sagt etwas aus, und sein Beweis zeigt, dass es so ist; in der Logik ist jeder Satz die Form eines Beweises. <\/p><p>Jeder Satz der Logik ist ein in Zeichen dargestellter modus ponens. (Und den modus ponens kann man nicht durch einen Satz ausdrücken.) <\/p>"}, {"n": "6.1265", "h": "<p> Immer kann man die Logik so auffassen, dass jeder Satz sein eigener Beweis ist. <\/p>"}, {"n": "6.127", "h": "<p> Alle Sätze der Logik sind gleichberechtigt, es gibt unter ihnen nicht wesentlich Grundgesetze und abgeleitete Sätze. <\/p><p>Jede Tautologie zeigt selbst, dass sie eine Tautologie ist. <\/p>"}, {"n": "6.1271", "h": "<p> Es ist klar, dass die Anzahl der „logischen Grundgesetze“ willkürlich ist, denn man könnte die Logik ja aus Einem Grundgesetz ableiten, indem man einfach z. B. aus Freges Grundgesetzen das logische Produkt bildet. (Frege würde vielleicht sagen, dass dieses Grundgesetz nun nicht mehr unmittelbar einleuchte. Aber es ist merkwürdig, dass ein so exakter Denker wie Frege sich auf den Grad des Einleuchtens als Kriterium des logischen Satzes berufen hat.) <\/p>"}, {"n": "6.13", "h": "<p> Die Logik ist keine Lehre, sondern ein Spiegelbild der Welt. Die Logik ist transcendental. <\/p>"}, {"n": "6.2", "h": "<p> Die Mathematik ist eine logische Methode. <\/p><p>Die Sätze der Mathematik sind Gleichungen also Scheinsätze. <\/p>"}, {"n": "6.21", "h": "<p> Der Satz der Mathematik drückt keinen Gedanken aus. <\/p>"}, {"n": "6.211", "h": "<p> Im Leben ist es ja nie der mathematische Satz, den wir brauchen, sondern wir benützen den mathematischen Satz <em class=\"sp\">nur<\/em>, um aus Sätzen, welche nicht der Mathematik angehören, auf andere zu schliessen, welche gleichfalls nicht der Mathematik angehören. <\/p><p>(In der Philosophie führt die Frage „wozu gebrauchen wir eigentlich jenes Wort, jenen Satz“ immer wieder zu wertvollen Einsichten.) <\/p>"}, {"n": "6.22", "h": "<p> Die Logik der Welt, die die Sätze der Logik in den Tautologien zeigen, zeigt die Mathematik in den Gleichungen. <\/p>"}, {"n": "6.23", "h": "<p> Wenn zwei Ausdrücke durch das Gleichheitszeichen verbunden werden, so heisst das, sie sind durch einander ersetzbar. Ob dies aber der Fall ist muss sich an den beiden Ausdrücken selbst zeigen. <\/p><p>Es charakterisiert die logische Form zweier Ausdrücke, dass sie durch einander ersetzbar sind. <\/p>"}, {"n": "6.231", "h": "<p> Es ist eine Eigenschaft der Bejahung, dass man sie als doppelte Verneinung auffassen kann. <\/p><p>Es ist eine Eigenschaft von „1 + 1 + 1 + 1“, dass man es als „(1 + 1) + (1 + 1)“ auffassen kann. <\/p>"}, {"n": "6.232", "h": "<p> Frege sagt, die beiden Ausdrücke haben dieselbe Bedeutung, aber verschiedenen Sinn. <\/p><p>Das Wesentliche an der Gleichung ist aber, dass sie nicht notwendig ist, um zu zeigen, dass die beiden Ausdrücke, die das Gleichheitszeichen verbindet, dieselbe Bedeutung haben, da sich dies aus den beiden Ausdrücken selbst ersehen lässt. <\/p>"}, {"n": "6.2321", "h": "<p> Und, dass die Sätze der Mathematik bewiesen werden können, heisst ja nichts anderes, als dass ihre Richtigkeit einzusehen ist, ohne dass das, was sie ausdrücken, selbst mit den Tatsachen auf seine Richtigkeit hin verglichen werden muss. <\/p>"}, {"n": "6.2322", "h": "<p> Die Identität der Bedeutung zweier Ausdrücke lässt sich nicht <em class=\"sp\">behaupten<\/em>. Denn um etwas von ihrer Bedeutung behaupten zu können, muss ich ihre Bedeutung kennen: und indem ich ihre Bedeutung kenne, weiss ich, ob sie dasselbe oder verschiedenes bedeuten. <\/p>"}, {"n": "6.2323", "h": "<p> Die Gleichung kennzeichnet nur den Standpunkt, von welchem ich die beiden Ausdrücke betrachte, nämlich vom Standpunkte ihrer Bedeutungsgleichheit. <\/p>"}, {"n": "6.233", "h": "<p> Die Frage, ob man zur Lösung der mathematischen Probleme die Anschauung brauche, muss dahin beantwortet werden, dass eben die Sprache hier die nötige Anschauung liefert. <\/p>"}, {"n": "6.2331", "h": "<p> Der Vorgang des <em class=\"sp\">Rechnens<\/em> vermittelt eben diese Anschauung. <\/p><p>Die Rechnung ist kein Experiment. <\/p>"}, {"n": "6.234", "h": "<p> Die Mathematik ist eine Methode der Logik. <\/p>"}, {"n": "6.2341", "h": "<p> Das Wesentliche der mathematischen Methode ist es, mit Gleichungen zu arbeiten. Auf dieser Methode beruht es nämlich, dass jeder Satz der Mathematik sich von selbst verstehen muss. <\/p>"}, {"n": "6.24", "h": "<p> Die Methode der Mathematik, zu ihren Gleichungen zu kommen, ist die Substitutionsmethode. <\/p><p>Denn die Gleichungen drücken die Ersetzbarkeit zweier Ausdrücke aus und wir schreiten von einer Anzahl von Gleichungen zu neuen Gleichungen vor, indem wir, den Gleichungen entsprechend, Ausdrücke durch andere ersetzen. <\/p>"}, {"n": "6.241", "h": "<p> So lautet der Beweis des Satzes 2 × 2 = 4: <\/p><p><span>\\(\\displaystyle{ ( \\Omega^{\\nu} )^{\\mu \\prime} x = \\Omega^{\\nu \\times \\mu \\prime} x \\text{ Def.} }\\)<\/span><\/p><p><span>\\(\\displaystyle{ \\Omega^{2 \\times 2 \\prime} x = (\\Omega^2 )^{2 \\prime} x = ( \\Omega^2 )^{1+1 \\prime} x = \\Omega^{2 \\prime} \\Omega^{2 \\prime} x = \\Omega^{1 + 1 \\prime} \\Omega^{1 + 1 \\prime} x }\\)<\/span><\/p><p><span>\\(\\displaystyle{ (\\Omega ' \\Omega)^{\\prime} (\\Omega ' \\Omega)^{\\prime} x = \\Omega ' \\Omega ' \\Omega ' \\Omega ' x = \\Omega^{1 + 1 + 1 + 1 \\prime} x = \\Omega^{4 \\prime} x }\\)<\/span><\/p>"}, {"n": "6.3", "h": "<p> Die Erforschung der Logik bedeutet die Erforschung <em class=\"sp\">aller Gesetzmässigkeit<\/em>. Und ausserhalb der Logik ist alles Zufall. <\/p>"}, {"n": "6.31", "h": "<p> Das sogenannte Gesetz der Induktion kann jedenfalls kein logisches Gesetz sein, denn es ist offenbar ein sinnvoller Satz. – Und darum kann es auch kein Gesetz a priori sein. <\/p>"}, {"n": "6.32", "h": "<p> Das Kausalitätsgesetz ist kein Gesetz, sondern die Form eines Gesetzes. <\/p>"}, {"n": "6.321", "h": "<p> „Kausalitätsgesetz“, das ist ein Gattungsname. Und wie es in der Mechanik, sagen wir, Minimum-Gesetze gibt, – etwa der kleinsten Wirkung – so gibt es in der Physik Kausalitätsgesetze, Gesetze von der Kausalitätsform. <\/p>"}, {"n": "6.3211", "h": "<p> Man hat ja auch davon eine Ahnung gehabt, dass es <em class=\"sp\">ein<\/em> „Gesetz der kleinsten Wirkung“ geben müsse, ehe man genau wusste, wie es lautete. (Hier, wie immer, stellt sich das a priori Gewisse als etwas rein Logisches heraus.) <\/p>"}, {"n": "6.33", "h": "<p> Wir <em class=\"sp\">glauben<\/em> nicht a priori an ein Erhaltungsgesetz, sondern wir <em class=\"sp\">wissen<\/em> a priori die Möglichkeit einer logischen Form. <\/p>"}, {"n": "6.34", "h": "<p> Alle jene Sätze, wie der Satz vom Grunde, von der Kontinuität in der Natur, vom kleinsten Aufwande in der Natur etc. etc., alle diese sind Einsichten a priori über die mögliche Formgebung der Sätze der Wissenschaft. <\/p>"}, {"n": "6.341", "h": "<p> Die Newtonsche Mechanik z. B. bringt die Weltbeschreibung auf eine einheitliche Form. Denken wir uns eine weisse Fläche, auf der unregelmässige schwarze Flecken wären. Wir sagen nun: Was für ein Bild immer hierdurch entsteht, immer kann ich seiner Beschreibung beliebig nahe kommen, indem ich die Fläche mit einem entsprechend feinen quadratischen Netzwerk bedecke und nun von jedem Quadrat sage, dass es weiss oder schwarz ist. Ich werde auf diese Weise die Beschreibung der Fläche auf eine einheitliche Form gebracht haben. Diese Form ist beliebig, denn ich hätte mit dem gleichen Erfolge ein Netz aus dreieckigen oder sechseckigen Maschen verwenden können. Es kann sein, dass die Beschreibung mit Hilfe eines Dreiecks-Netzes einfacher geworden wäre; das heisst, dass wir die Fläche mit einem gröberen Dreiecks-Netz genauer beschreiben könnten, als mit einem feineren quadratischen (oder umgekehrt) u. s. w. Den verschiedenen Netzen entsprechen verschiedene Systeme der Weltbeschreibung. Die Mechanik bestimmt eine Form der Weltbeschreibung, indem sie sagt: Alle Sätze der Weltbeschreibung müssen aus einer Anzahl gegebener Sätze – den mechanischen Axiomen – auf eine gegebene Art und Weise erhalten werden. Hierdurch liefert sie die Bausteine zum Bau des wissenschaftlichen Gebäudes und sagt: Welches Gebäude immer du aufführen willst, jedes musst du irgendwie mit diesen und nur diesen Bausteinen zusammenbringen. <\/p><p>(Wie man mit dem Zahlensystem jede beliebige Anzahl, so muss man mit dem System der Mechanik jeden beliebigen Satz der Physik hinschreiben können.) <\/p>"}, {"n": "6.342", "h": "<p> Und nun sehen wir die gegenseitige Stellung von Logik und Mechanik. (Man könnte das Netz auch aus verschiedenartigen Figuren etwa aus Dreiecken und Sechsecken bestehen lassen.) Dass sich ein Bild, wie das vorhin erwähnte, durch ein Netz von gegebener Form beschreiben lässt, sagt über das Bild <em class=\"sp\">nichts<\/em> aus. (Denn dies gilt für jedes Bild dieser Art.) <em class=\"sp\">Das<\/em> aber charakterisiert das Bild, dass es sich durch ein bestimmtes Netz von <em class=\"sp\">bestimmter<\/em> Feinheit <em class=\"sp\">vollständig<\/em> beschreiben lässt. <\/p><p>So auch sagt es nichts über die Welt aus, dass sie sich durch die Newtonsche Mechanik beschreiben lässt; wohl aber, dass sie sich <em class=\"sp\">so<\/em> durch jene beschreiben lässt, wie dies eben der Fall ist. Auch das sagt etwas über die Welt, dass sie sich durch die eine Mechanik einfacher beschreiben lässt, als durch die andere. <\/p>"}, {"n": "6.343", "h": "<p> Die Mechanik ist ein Versuch, alle <em class=\"sp\">wahren<\/em> Sätze, die wir zur Weltbeschreibung brauchen, nach Einem Plane zu konstruieren. <\/p>"}, {"n": "6.3431", "h": "<p> Durch den ganzen logischen Apparat hindurch sprechen die physikalischen Gesetze doch von den Gegenständen der Welt. <\/p>"}, {"n": "6.3432", "h": "<p> Wir dürfen nicht vergessen, dass die Weltbeschreibung durch die Mechanik immer die ganz allgemeine ist. Es ist in ihr z. B. nie von <em class=\"sp\">bestimmten<\/em> materiellen Punkten die Rede, sondern immer nur von <em class=\"sp\">irgend welchen<\/em>. <\/p>"}, {"n": "6.35", "h": "<p> Obwohl die Flecke in unserem Bild geometrische Figuren sind, so kann doch selbstverständlich die Geometrie gar nichts über ihre tatsächliche Form und Lage sagen. Das Netz aber ist <em class=\"sp\">rein<\/em> geometrisch, alle seine Eigenschaften können a priori angegeben werden. <\/p><p>Gesetze, wie der Satz vom Grunde, etc., handeln vom Netz, nicht von dem, was das Netz beschreibt. <\/p>"}, {"n": "6.36", "h": "<p> Wenn es ein Kausalitätsgesetz gäbe, so könnte es lauten: „Es gibt Naturgesetze“. <\/p><p>Aber freilich kann man das nicht sagen: es zeigt sich. <\/p>"}, {"n": "6.361", "h": "<p> In der Ausdrucksweise Hertz’s könnte man sagen: Nur <em class=\"sp\">gesetzmässige<\/em> Zusammenhänge sind <em class=\"sp\">denkbar<\/em>. <\/p>"}, {"n": "6.3611", "h": "<p> Wir können keinen Vorgang mit dem „Ablauf der Zeit“ vergleichen – diesen gibt es nicht –, sondern nur mit einem anderen Vorgang (etwa mit dem Gang des Chronometers). <\/p><p>Daher ist die Beschreibung des zeitlichen Verlaufs nur so möglich, dass wir uns auf einen anderen Vorgang stützen. <\/p><p>Ganz Analoges gilt für den Raum. Wo man z. B. sagt, es könne keines von zwei Ereignissen (die sich gegenseitig ausschliessen) eintreten, weil <em class=\"sp\">keine Ursache<\/em> vorhanden sei, warum das eine eher als das andere eintreten solle, da handelt es sich in Wirklichkeit darum, dass man gar nicht <em class=\"sp\">eines<\/em> der beiden Ereignisse beschreiben kann, wenn nicht irgend eine Asymmetrie vorhanden ist. Und <em class=\"sp\">wenn<\/em> eine solche Asymmetrie vorhanden <em class=\"sp\">ist<\/em>, so können wir diese als <em class=\"sp\">Ursache<\/em> des Eintreffens des einen und Nicht-Eintreffens des anderen auffassen. <\/p>"}, {"n": "6.36111", "h": "<p> Das Kant’sche Problem von der rechten und linken Hand, die man nicht zur Deckung bringen kann, besteht schon in der Ebene, ja im eindimensionalen Raum, wo die beiden kongruenten Figuren <i>a<\/i> und <i>b<\/i> auch nicht zur Deckung gebracht werden können, ohne aus diesem Raum herausbewegt zu werden. Rechte und linke Hand sind tatsächlich vollkommen kongruent. Und dass man sie nicht zur Deckung bringen kann, hat damit nichts zu tun. <\/p><figure><span><img src=\"data:image/png;
