6.36311", "h": "<p> Dass die Sonne morgen aufgehen wird, ist eine Hypothese; und das heisst: wir <em class=\"sp\">wissen<\/em> nicht, ob sie aufgehen wird. <\/p>"}, {"n": "6.37", "h": "<p> Einen Zwang, nach dem Eines geschehen müsste, weil etwas anderes geschehen ist, gibt es nicht. Es gibt nur eine <em class=\"sp\">logische<\/em> Notwendigkeit. <\/p>"}, {"n": "6.371", "h": "<p> Der ganzen modernen Weltanschauung liegt die Täuschung zugrunde, dass die sogenannten Naturgesetze die Erklärungen der Naturerscheinungen seien. <\/p>"}, {"n": "6.372", "h": "<p> So bleiben sie bei den Naturgesetzen als bei etwas Unantastbarem stehen, wie die Älteren bei Gott und dem Schicksal. <\/p><p>Und sie haben ja beide Recht, und Unrecht. Die Alten sind allerdings insofern klarer, als sie einen klaren Abschluss anerkennen, während es bei dem neuen System scheinen soll, als sei <em class=\"sp\">alles<\/em> erklärt. <\/p>"}, {"n": "6.373", "h": "<p> Die Welt ist unabhängig von meinem Willen. <\/p>"}, {"n": "6.374", "h": "<p> Auch wenn alles, was wir wünschen, geschähe, so wäre dies doch nur, sozusagen, eine Gnade des Schicksals, denn es ist kein <em class=\"sp\">logischer<\/em> Zusammenhang zwischen Willen und Welt, der dies verbürgte, und den angenommenen physikalischen Zusammenhang könnten wir doch nicht selbst wieder wollen. <\/p>"}, {"n": "6.375", "h": "<p> Wie es nur eine <em class=\"sp\">logische<\/em> Notwendigkeit gibt, so gibt es auch nur eine <em class=\"sp\">logische<\/em> Unmöglichkeit. <\/p>"}, {"n": "6.3751", "h": "<p> Dass z. B. zwei Farben zugleich an einem Ort des Gesichtsfeldes sind, ist unmöglich und zwar logisch unmöglich, denn es ist durch die logische Struktur der Farbe ausgeschlossen. <\/p><p>Denken wir daran, wie sich dieser Widerspruch in der Physik darstellt: Ungefähr so, dass ein Teilchen nicht zu gleicher Zeit zwei Geschwindigkeiten haben kann; das heisst, dass es nicht zu gleicher Zeit an zwei Orten sein kann; das heisst, dass Teilchen an verschiedenen Orten zu Einer Zeit nicht identisch sein können. <\/p><p>(Es ist klar, dass das logische Produkt zweier Elementarsätze weder eine Tautologie noch eine Kontradiktion sein kann. Die Aussage, dass ein Punkt des Gesichtsfeldes zu gleicher Zeit zwei verschiedene Farben hat, ist eine Kontradiktion.) <\/p>"}, {"n": "6.4", "h": "<p> Alle Sätze sind gleichwertig. <\/p>"}, {"n": "6.41", "h": "<p> Der Sinn der Welt muss ausserhalb ihrer liegen. In der Welt ist alles wie es ist und geschieht alles wie es geschieht; es gibt <em class=\"sp\">in<\/em> ihr keinen Wert – und wenn es ihn gäbe, so hätte er keinen Wert. <\/p><p>Wenn es einen Wert gibt, der Wert hat, so muss er ausserhalb alles Geschehens und So-Seins liegen. Denn alles Geschehen und So-Sein ist zufällig. <\/p><p>Was es nicht-zufällig macht, kann nicht <em class=\"sp\">in<\/em> der Welt liegen, denn sonst wäre dies wieder zufällig. <\/p><p>Es muss ausserhalb der Welt liegen. <\/p>"}, {"n": "6.42", "h": "<p> Darum kann es auch keine Sätze der Ethik geben. Sätze können nichts Höheres ausdrücken. <\/p>"}, {"n": "6.421", "h": "<p> Es ist klar, dass sich die Ethik nicht aussprechen lässt. Die Ethik ist transcendental. <\/p><p>(Ethik und Aesthetik sind Eins.) <\/p>"}, {"n": "6.422", "h": "<p> Der erste Gedanke bei der Aufstellung eines ethischen Gesetzes von der Form „du sollst <i>. . . .<\/i>“ ist: Und was dann, wenn ich es nicht tue? Es ist aber klar, dass die Ethik nichts mit Strafe und Lohn im gewöhnlichen Sinne zu tun hat. Also muss diese Frage nach den <em class=\"sp\">Folgen<\/em> einer Handlung belanglos sein. – Zum Mindesten dürfen diese Folgen nicht Ereignisse sein. Denn etwas muss doch an jener Fragestellung richtig sein. Es muss zwar eine Art von ethischem Lohn und ethischer Strafe geben, aber diese müssen in der Handlung selbst liegen. <\/p><p>(Und das ist auch klar, dass der Lohn etwas Angenehmes, die Strafe etwas Unangenehmes sein muss.) <\/p>"}, {"n": "6.423", "h": "<p> Vom Willen als dem Träger des Ethischen kann nicht gesprochen werden. <\/p><p>Und der Wille als Phänomen interessiert nur die Psychologie. <\/p>"}, {"n": "6.43", "h": "<p> Wenn das gute oder böse Wollen die Welt ändert, so kann es nur die Grenzen der Welt ändern, nicht die Tatsachen; nicht das, was durch die Sprache ausgedrückt werden kann. <\/p><p>Kurz, die Welt muss dann dadurch überhaupt eine andere werden. Sie muss sozusagen als Ganzes abnehmen oder zunehmen. <\/p><p>Die Welt des Glücklichen ist eine andere als die des Unglücklichen. <\/p>"}, {"n": "6.431", "h": "<p> Wie auch beim Tod die Welt sich nicht ändert, sondern aufhört. <\/p>"}, {"n": "6.4311", "h": "<p> Der Tod ist kein Ereignis des Lebens. Den Tod erlebt man nicht. <\/p><p>Wenn man unter Ewigkeit nicht unendliche Zeitdauer, sondern Unzeitlichkeit versteht, dann lebt der ewig, der in der Gegenwart lebt. <\/p><p>Unser Leben ist ebenso endlos, wie unser Gesichtsfeld grenzenlos ist. <\/p>"}, {"n": "6.4312", "h": "<p> Die zeitliche Unsterblichkeit der Seele des Menschen, das heisst also ihr ewiges Fortleben auch nach dem Tode, ist nicht nur auf keine Weise verbürgt, sondern vor allem leistet diese Annahme gar nicht das, was man immer mit ihr erreichen wollte. Wird denn dadurch ein Rätsel gelöst, dass ich ewig fortlebe? Ist denn dieses ewige Leben dann nicht ebenso rätselhaft wie das gegenwärtige? Die Lösung des Rätsels des Lebens in Raum und Zeit liegt <em class=\"sp\">ausserhalb<\/em> von Raum und Zeit. <\/p><p>(Nicht Probleme der Naturwissenschaft sind ja zu lösen.) <\/p>"}, {"n": "6.432", "h": "<p> <em class=\"sp\">Wie<\/em> die Welt ist, ist für das Höhere vollkommen gleichgültig. Gott offenbart sich nicht <em class=\"sp\">in<\/em> der Welt. <\/p>"}, {"n": "6.4321", "h": "<p> Die Tatsachen gehören alle nur zur Aufgabe, nicht zur Lösung. <\/p>"}, {"n": "6.44", "h": "<p> Nicht <em class=\"sp\">wie<\/em> die Welt ist, ist das Mystische, sondern <em class=\"sp\">dass<\/em> sie ist. <\/p>"}, {"n": "6.45", "h": "<p> Die Anschauung der Welt sub specie aeterni ist ihre Anschauung als – begrenztes – Ganzes. <\/p><p>Das Gefühl der Welt als begrenztes Ganzes ist das mystische. <\/p>"}, {"n": "6.5", "h": "<p> Zu einer Antwort, die man nicht aussprechen kann, kann man auch die Frage nicht aussprechen. <\/p><p><em class=\"sp\">Das Rätsel<\/em> gibt es nicht. <\/p><p>Wenn sich eine Frage überhaupt stellen lässt, so <em class=\"sp\">kann<\/em> sie auch beantwortet werden. <\/p>"}, {"n": "6.51", "h": "<p> Skeptizismus ist <em class=\"sp\">nicht<\/em> unwiderleglich, sondern offenbar unsinnig, wenn er bezweifeln will, wo nicht gefragt werden kann. <\/p><p>Denn Zweifel kann nur bestehen, wo eine Frage besteht; eine Frage nur, wo eine Antwort besteht, und diese nur, wo etwas <em class=\"sp\">gesagt<\/em> werden <em class=\"sp\">kann<\/em>. <\/p>"}, {"n": "6.52", "h": "<p> Wir fühlen, dass selbst, wenn alle <em class=\"sp\">möglichen<\/em> wissenschaftlichen Fragen beantwortet sind, unsere Lebensprobleme noch gar nicht berührt sind. Freilich bleibt dann eben keine Frage mehr; und eben dies ist die Antwort. <\/p>"}, {"n": "6.521", "h": "<p> Die Lösung des Problems des Lebens merkt man am Verschwinden dieses Problems. <\/p><p>(Ist nicht dies der Grund, warum Menschen, denen der Sinn des Lebens nach langen Zweifeln klar wurde, warum diese dann nicht sagen konnten, worin dieser Sinn bestand.) <\/p>"}, {"n": "6.522", "h": "<p> Es gibt allerdings Unaussprechliches. Dies <em class=\"sp\">zeigt<\/em> sich, es ist das Mystische. <\/p>"}, {"n": "6.53", "h": "<p> Die richtige Methode der Philosophie wäre eigentlich die: Nichts zu sagen, als was sich sagen lässt, also Sätze der Naturwissenschaft – also etwas, was mit Philosophie nichts zu tun hat –, und dann immer, wenn ein anderer etwas Metaphysisches sagen wollte, ihm nachzuweisen, dass er gewissen Zeichen in seinen Sätzen keine Bedeutung gegeben hat. Diese Methode wäre für den anderen unbefriedigend – er hätte nicht das Gefühl, dass wir ihn Philosophie lehrten – aber <em class=\"sp\">sie<\/em> wäre die einzig streng richtige. <\/p>"}, {"n": "6.54", "h": "<p> Meine Sätze erläutern dadurch, dass sie der, welcher mich versteht, am Ende als unsinnig erkennt, wenn er durch sie – auf ihnen – über sie hinausgestiegen ist. (Er muss sozusagen die Leiter wegwerfen, nachdem er auf ihr hinaufgestiegen ist.) <\/p><p>Er muss diese Sätze überwinden, dann sieht er die Welt richtig. <\/p>"}, {"n": "7", "h": "<p> Wovon man nicht sprechen kann, darüber muss man schweigen. <\/p>"}]</script>
<script>
(function(){
const RAW = JSON.parse(document.getElementById('data').textContent);
const byN = new Map(), order = [];
const plain = h => { const d=document.createElement('div'); d.innerHTML=h.replace(/\\\((.*?)\\\)/g,' ⟨Formel⟩ '); d.querySelectorAll('figure,table').forEach(x=>x.replaceWith(' ⟨Abb.⟩ ')); return d.textContent.replace(/\s+/g,' ').trim(); };
RAW.forEach((r,i)=>{ const o={n:r.n, h:r.h, t:plain(r.h), i, kids:[]}; byN.set(r.n,o); order.push(o); });
const root = {n:'TLP', t:'Logisch-philosophische Abhandlung', kids:[], i:-1, root:true};
function parentOf(n){ let m=n; while(true){ m=m.slice(0,-1).replace(/\.$/,''); if(!m) return root; if(byN.has(m)) return byN.get(m); } }
order.forEach(o=>{ const p=parentOf(o.n); o.parent=p; p.kids.push(o); });
const branchOf = o => o.root ? 0 : +o.n[0];
const css = getComputedStyle(document.documentElement);
const colorOf = o => o.root ? 'var(--ink)' : `var(--b${branchOf(o)})`;
const short = (s,k=7) => { const w=s.split(' '); return w.slice(0,k).join(' ') + (w.length>k?' …':''); };
const clip = (s,c=34) => s.length<=c ? s : s.slice(0, s.lastIndexOf(' ', c) > 10 ? s.lastIndexOf(' ', c) : c) + ' …';

// ---------- hierarchy with collapsible state ----------
const open = new Set(['TLP']);
let radial = false, selected = null;
const svg = d3.select('#svg'), vp = d3.select('#vp'), gL = d3.select('#links'), gN = d3.select('#nodes');
const zoom = d3.zoom().scaleExtent([0.08, 3]).on('zoom', e => vp.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);

function build(){
  const h = d3.hierarchy(root, d => open.has(d.n) ? d.kids : null);
  const leaves = h.leaves().length;
  if(radial){
    const R = Math.max(260, leaves * 4.2);
    d3.tree().size([2*Math.PI, R]).separation((a,b)=>(a.parent===b.parent?1:2)/a.depth)(h);
  } else {
    d3.tree().nodeSize([22, 250]).separation((a,b)=>a.parent===b.parent?1:1.5)(h);
  }
  return h;
}
const pos = d => radial ? [Math.cos(d.x - Math.PI/2)*d.y, Math.sin(d.x - Math.PI/2)*d.y] : [d.y, d.x];
const lastPos = new Map();

function render(focus){
  const h = build(), nodes = h.descendants(), links = h.links();
  const T = d3.transition().duration(550).ease(d3.easeCubicInOut);
  const origin = n => { let p=n.parent; while(p){ if(lastPos.has(p.data.n)) return lastPos.get(p.data.n); p=p.parent; } return [0,0]; };

  const linkPath = (s,t) => radial
    ? d3.linkRadial().angle(d=>d.x).radius(d=>d.y)({source:s, target:t})
    : d3.linkHorizontal()({source:[s.y,s.x], target:[t.y,t.x]});
  const pt = ([x,y]) => radial ? {x:Math.atan2(y,x)+Math.PI/2, y:Math.hypot(x,y)} : {x:y, y:x};

  const L = gL.selectAll('path').data(links, d=>d.target.data.n);
  L.exit().transition(T).style('opacity',0).remove();
  L.enter().append('path').attr('class','link')
    .attr('d', d=>{ const o=pt(origin(d.target)); return linkPath(o,o); })
    .merge(L)
    .attr('stroke', d=>colorOf(d.target.data))
    .attr('stroke-width', d=>Math.max(0.9, 6.5 - d.target.depth*1.1))
    .transition(T).attr('d', d=>linkPath(d.source,d.target));

  const N = gN.selectAll('g.node').data(nodes, d=>d.data.n);
  N.exit().transition(T).style('opacity',0).remove();
  const NE = N.enter().append('g').attr('class', d=>'node'+(d.data.root?' root':''))
    .attr('transform', d=>`translate(${origin(d)})`).style('opacity',0)
    .on('click', (e,d)=>{ e.stopPropagation(); onNode(d.data); });
  NE.append('circle');
  NE.append('text').attr('class','num');
  NE.append('text').attr('class','lbl');
  const NM = NE.merge(N);
  NM.classed('sel', d=>selected && d.data.n===selected.n);
  NM.select('circle')
    .attr('r', d=> d.data.root ? 9 : Math.max(3.2, 8 - d.depth*1.1))
    .attr('fill', d=> (d.data.kids.length && !open.has(d.data.n)) ? colorOf(d.data) : 'var(--paper)')
    .attr('stroke', d=>colorOf(d.data))
    .attr('stroke-width', d=> (d.data.kids.length && !open.has(d.data.n)) ? 1.5 : 2.2);
  NM.each(function(d){
    const g=d3.select(this), [x,y]=pos(d);
    const flip = radial && (d.x > Math.PI);
    const rot = radial ? (d.x*180/Math.PI - 90) : 0;
    const isOpen = open.has(d.data.n) && d.data.kids.length;
    const showLbl = !d.data.root && !isOpen;
    const num = g.select('text.num').text(d.data.root ? 'TLP' : d.data.n);
    const lbl = g.select('text.lbl').text(showLbl ? clip(d.data.t, radial?30:34) : '');
    if(radial && !d.data.root){
      const a = flip ? rot+180 : rot, anchor = flip ? 'end' : 'start', dx = flip ? -11 : 11;
      num.attr('transform',`rotate(${a})`).attr('text-anchor',anchor).attr('x',dx).attr('dy','.32em').attr('y',0);
      lbl.attr('transform',`rotate(${a})`).attr('text-anchor',anchor).attr('x', flip? dx - num.node().getComputedTextLength()-8 : dx + num.node().getComputedTextLength()+8).attr('dy','.32em').attr('y',0);
    } else {
      const isRoot = d.data.root;
      if(isRoot) num.attr('transform',null).attr('text-anchor','end').attr('x',-16).attr('dy','.32em').attr('y',0);
      else if(isOpen) num.attr('transform',null).attr('text-anchor','end').attr('x',-8).attr('dy','0').attr('y',-8);
      else num.attr('transform',null).attr('text-anchor','start').attr('x',11).attr('dy','.32em').attr('y',0);
      lbl.attr('transform',null).attr('text-anchor','start').attr('x', 11 + num.node().getComputedTextLength() + 8).attr('dy','.32em').attr('y',0);
    }
    lastPos.set(d.data.n, [x,y]);
  });
  NM.transition(T).style('opacity',1).attr('transform', d=>`translate(${pos(d)})`);

  if(focus){ const f = nodes.find(n=>n.data.n===focus.n); if(f) centerOn(pos(f)); }
}
function centerOn([x,y], k){
  const r = svg.node().getBoundingClientRect();
  const cur = d3.zoomTransform(svg.node());
  const s = k || Math.max(cur.k, radial ? 0.35 : 0.75);
  svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate((radial?0.5:0.38)*r.width - x*s, r.height/2 - y*s).scale(s));
}
function fit(){
  const b = vp.node().getBBox(), r = svg.node().getBoundingClientRect();
  if(!b.width) return;
  const s = Math.min(1.1, 0.9*Math.min(r.width/b.width, r.height/b.height));
  svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate(r.width/2 - (b.x+b.width/2)*s, r.height/2 - (b.y+b.height/2)*s).scale(s));
}

// ---------- selection / panel ----------
function openPath(o){ let p=o.parent; while(p){ open.add(p.n); p=p.parent; } }
function onNode(o){
  if(o.root){ select(null); return; }
  if(selected && selected.n===o.n && o.kids.length){ open.has(o.n) ? open.delete(o.n) : open.add(o.n); render(o); return; }
  if(o.kids.length) open.add(o.n);
  select(o);
}
function select(o, noRender){
  selected = o;
  const panel = document.getElementById('panel');
  const elNum=document.getElementById('num'), elText=document.getElementById('text'), elCr=document.getElementById('crumbs'), elMeta=document.getElementById('meta'), elKids=document.getElementById('kids');
  if(!o){
    elCr.innerHTML=''; elNum.innerHTML='<span>TLP</span>';
    elMeta.textContent='526 Sätze · 7 Hauptsätze';
    elText.innerHTML='<p>Wittgensteins <i>Logisch-philosophische Abhandlung</i> ist als Baum gebaut: Jeder Satz kommentiert den Satz, dessen Nummer um eine Stelle kürzer ist. Die sieben Hauptsätze tragen das Ganze.</p><p>Wähle links einen Ast oder suche oben nach einer Nummer oder einem Wort.</p>';
    renderKids(root.kids, elKids, 'Die sieben Hauptsätze');
    document.getElementById('prev').disabled = true; document.getElementById('next').disabled = false;
    history.replaceState(null,'',location.pathname);
  } else {
    openPath(o);
    const chain=[]; let p=o.parent; while(p && !p.root){ chain.unshift(p); p=p.parent; }
    elCr.innerHTML = '<a data-n="TLP">TLP</a>' + chain.map(c=>` › <a data-n="${c.n}">${c.n}</a>`).join('') + ` › <span>${o.n}</span>`;
    elNum.innerHTML = `<span class="dot" style="background:${colorOf(o)}"></span><span>${o.n}</span>`;
    const depth = o.n.replace('.','').length;
    elMeta.textContent = (depth===1 ? 'Hauptsatz' : `Ebene ${depth} · Kommentar zu ${o.parent.n}`) + ` · Satz ${o.i+1} von ${order.length}`;
    elText.innerHTML = o.h;
    renderKids(o.kids, elKids, o.kids.length ? `Kommentare zu ${o.n} (${o.kids.length})` : 'Kommentare');
    document.getElementById('prev').disabled = o.i===0; document.getElementById('next').disabled = o.i===order.length-1;
    history.replaceState(null,'','#'+o.n);
  }
  [elNum, elText].forEach(e=>{ e.classList.remove('fade'); void e.offsetWidth; e.classList.add('fade'); });
  panel.scrollTop = 0;
  if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([elText]).catch(()=>{});
  if(!noRender) render(o || root);
}
function renderKids(kids, el, title){
  document.getElementById('kidsH').textContent = title;
  el.innerHTML = kids.length ? kids.map(k=>`<li data-n="${k.n}"><b>${k.n}</b>${short(k.t,18)}</li>`).join('') : '<li class="empty" style="cursor:default;border:none;padding-left:0">Keine weiteren Kommentare – ein Blatt des Baumes.</li>';
}
document.getElementById('crumbs').addEventListener('click', e=>{ const n=e.target.dataset.n; if(!n) return; n==='TLP' ? select(null) : select(byN.get(n)); });
document.getElementById('kids').addEventListener('click', e=>{ const li=e.target.closest('li[data-n]'); if(li){ const o=byN.get(li.dataset.n); if(o.kids.length) open.add(o.n); select(o);} });
const step = d => { const i = selected ? selected.i + d : (d>0?0:-1); if(i>=0 && i<order.length) select(order[i]); };
document.getElementById('prev').onclick = ()=>step(-1);
document.getElementById('next').onclick = ()=>step(1);
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'){ e.preventDefault(); step(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1); }
  else if(e.key==='ArrowUp' && selected){ e.preventDefault(); selected.parent.root ? select(null) : select(selected.parent); }
  else if(e.key==='/'){ e.preventDefault(); q.focus(); }
});

// ---------- toolbar ----------
document.getElementById('bRadial').onclick = function(){
  radial = !radial; this.setAttribute('aria-pressed', radial);
  lastPos.clear(); gL.selectAll('*').remove(); gN.selectAll('*').remove();
  render(); setTimeout(()=> selected ? render(selected) : fit(), 700);
};
document.getElementById('bExpand').onclick = ()=>{ order.forEach(o=>{ if(o.kids.length) open.add(o.n); }); render(); setTimeout(fit, 600); };
document.getElementById('bCollapse').onclick = ()=>{ open.clear(); open.add('TLP'); if(selected) openPath(selected); render(); setTimeout(fit, 600); };
document.getElementById('bTheme').onclick = ()=>{
  const r=document.documentElement, dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

// ---------- search ----------
const q = document.getElementById('q'), res = document.getElementById('results');
const norm = s => s.toLowerCase().replace(/ß/g,'ss');
let hits=[], act=-1;
q.addEventListener('input', ()=>{
  const v = q.value.trim(); act=-1;
  gN.selectAll('g.node').classed('hit', false);
  if(!v){ res.classList.remove('open'); return; }
  const nv = norm(v);
  hits = /^[\d.]+$/.test(v) ? order.filter(o=>o.n.startsWith(v)) : order.filter(o=>norm(o.t).includes(nv));
  hits = hits.slice(0, 80);
  const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  res.innerHTML = hits.length ? hits.map((o,i)=>{
    let t=o.t, k=norm(t).indexOf(nv);
    let snip = k>40 ? '… '+t.slice(k-40) : t; snip = snip.slice(0,160);
    let s = esc(snip);
    if(!/^[\d.]+$/.test(v)){ const re=new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); s=s.replace(re,'<mark>$1</mark>'); }
    return `<div data-i="${i}"><b>${o.n}</b>${s}</div>`;
  }).join('') : '<div style="cursor:default"><i>Nichts gefunden.</i></div>';
  res.classList.add('open');
  const hs = new Set(hits.map(h=>h.n));
  gN.selectAll('g.node').classed('hit', d=>hs.has(d.data.n));
});
res.addEventListener('click', e=>{ const d=e.target.closest('[data-i]'); if(d) pick(hits[+d.dataset.i]); });
q.addEventListener('keydown', e=>{
  const items=[...res.querySelectorAll('[data-i]')];
  if(e.key==='ArrowDown'){ act=Math.min(items.length-1, act+1); }
  else if(e.key==='ArrowUp'){ act=Math.max(0, act-1); }
  else if(e.key==='Enter'){ pick(hits[act<0?0:act]); return; }
  else if(e.key==='Escape'){ res.classList.remove('open'); q.blur(); return; }
  else return;
  e.preventDefault(); items.forEach((x,i)=>x.classList.toggle('active', i===act)); items[act]?.scrollIntoView({block:'nearest'});
});
function pick(o){ if(!o) return; res.classList.remove('open'); if(o.kids.length) open.add(o.n); select(o); }
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) res.classList.remove('open'); });

// ---------- start ----------
const start = decodeURIComponent(location.hash.slice(1));
if(start && byN.has(start)){ select(byN.get(start)); }
else { select(null, true); render(); setTimeout(fit, 80); }
window.addEventListener('resize', ()=> selected ? null : fit());
})();
</script>
